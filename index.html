function App() {
  const [appData, setAppData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [activeTab, setActiveTab] = useState('dashboard');
  const [editRequestId, setEditRequestId] = useState(null);
  const goAddService = c => { setEditRequestId(c.id); setActiveTab('crm'); };
  const [message, setMessage] = useState(null);
  const [printingReceipt, setPrintingReceipt] = useState(null);
  const [syncTime, setSyncTime] = useState(null);
  const [syncOk, setSyncOk] = useState(true);
  const [isFullscreen, setIsFullscreen] = useState(false);

  const isBanking = false;
  const isDashboard = false;
  const isCashClose = false;
  const sideColor = 'aic';
  const sc = (g, s, d) => isBanking ? g : isDashboard ? d : isCashClose ? s : g.replace('green','indigo');
  // sc(green-ver, orange-ver, purple-ver) helper not used directly — we use sideColor
  const SB = (cls) => {
    // replace color token in class string
    return cls
      .replace(/bg-indigo-(\d+)/g, `bg-${sideColor}-$1`)
      .replace(/border-indigo-(\d+)/g, `border-${sideColor}-$1`)
      .replace(/text-indigo-(\d+)/g, `text-${sideColor}-$1`)
      .replace(/hover:bg-indigo-(\d+)/g, `hover:bg-${sideColor}-$1`)
      .replace(/ring-indigo-(\d+)/g, `ring-${sideColor}-$1`);
  };

  const toggleFullscreen = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
    } else {
      document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
    }
  };

  useEffect(() => {
    const handler = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', handler);
    return () => document.removeEventListener('fullscreenchange', handler);
  }, []);

  const handleRefresh = () => {
    const ref = db.ref('csc-app-data');
    ref.once('value').then(snap => {
      const val = snap.val();
      if (val) {
        let finalVal = val;
        if (!val.customerIdMigrationDone) {
          try { finalVal = migrateCustomerIds(val); } catch (err) { console.error('Customer ID migration failed, continuing without it:', err); finalVal = val; }
          if (finalVal !== val) db.ref('csc-app-data').set(finalVal).catch(() => {});
        }
        setAppData(finalVal); setSyncOk(true); setSyncTime(new Date()); showMessage('Data refreshed!');
      }
      else showMessage('No data found.', 'error');
    }).catch(() => { setSyncOk(false); showMessage('Refresh failed. Check connection.', 'error'); });
  };

  const showMessage = (msg, type = 'success') => { setMessage({ text: msg, type }); setTimeout(() => setMessage(null), 3000); };

  useEffect(() => {
    const ref = db.ref('csc-app-data');
    const handler = ref.on('value', snapshot => {
      const val = snapshot.val();
      if (val) {
        if (!val.customerIdMigrationDone) {
          // One-time Customer ID setup (see migrateCustomerIds above). Wrapped defensively —
          // if it ever throws on unexpected data shape, fall back to loading as-is rather than
          // breaking the app; migration will simply be retried on the next load.
          let migrated = val;
          try { migrated = migrateCustomerIds(val); }
          catch (err) { console.error('Customer ID migration failed, continuing without it:', err); migrated = val; }
          setAppData(migrated); setSyncOk(true); setSyncTime(new Date()); setLoading(false);
          if (migrated !== val) db.ref('csc-app-data').set(migrated).catch(() => {});
        } else {
          setAppData(val); setSyncOk(true); setSyncTime(new Date()); setLoading(false);
        }
      }
      else { ref.set(defaultData).then(() => { setSyncOk(true); setSyncTime(new Date()); setLoading(false); }).catch(() => { setLoadError(true); setLoading(false); }); }
    }, () => { setSyncOk(false); setLoadError(true); setLoading(false); });
    return () => ref.off('value', handler);
  }, []);

  useEffect(() => {
    if (!appData || !currentUser) return;
    const list = Array.isArray(appData.users) ? appData.users : Object.values(appData.users || {});
    const fresh = list.find(u => u.id === currentUser.id);
    if (!fresh) { setCurrentUser(null); showMessage('Account removed.', 'error'); }
    else if (JSON.stringify(fresh) !== JSON.stringify(currentUser)) setCurrentUser(fresh);
  }, [appData]);

  const persist = useCallback(async (newData) => {
    setAppData(newData);
    try { await db.ref('csc-app-data').set(newData); setSyncOk(true); setSyncTime(new Date()); }
    catch { setSyncOk(false); showMessage('Save failed. Check internet connection.', 'error'); }
  }, []);

  const gl = (key) => { if (!appData || !appData[key]) return []; return Array.isArray(appData[key]) ? appData[key] : Object.values(appData[key]); };
  const setUsers = v => persist({ ...appData, users: typeof v === 'function' ? v(gl('users')) : v });
  const setServices = v => persist({ ...appData, services: typeof v === 'function' ? v(gl('services')) : v });
  const setTasks = v => persist({ ...appData, tasks: typeof v === 'function' ? v(gl('tasks')) : v });
  const setCustomers = v => persist({ ...appData, customers: typeof v === 'function' ? v(gl('customers')) : v });
  const setExpenses = v => persist({ ...appData, expenses: typeof v === 'function' ? v(gl('expenses')) : v });
  const setBankTransactions = v => persist({ ...appData, bankTransactions: typeof v === 'function' ? v(gl('bankTransactions')) : v });
  const setBankingOpeningBalance = v => persist({ ...appData, bankingOpeningBalance: typeof v === 'function' ? v(appData.bankingOpeningBalance || 0) : v });
  const setBankingOpeningBalances = v => persist({ ...appData, bankingOpeningBalances: typeof v === 'function' ? v(appData.bankingOpeningBalances || {}) : v });
  const addMoreHistory = (appData && appData.addMoreHistory && typeof appData.addMoreHistory === 'object') ? appData.addMoreHistory : {};
  const setAddMoreHistory = v => { const cur = (appData && appData.addMoreHistory && typeof appData.addMoreHistory === 'object') ? appData.addMoreHistory : {}; persist({ ...appData, addMoreHistory: typeof v === 'function' ? v(cur) : v }); };
  const setCashClosingLogs = v => persist({ ...appData, cashClosingLogs: typeof v === 'function' ? v(gl('cashClosingLogs')) : v });
  const onlineTransactions = gl('onlineTransactions') || [];
  // This setter was referenced (as a shorthand prop) when the Online Transaction menu was
  // added but was never actually defined — opening that menu threw "setOnlineTransactions
  // is not defined" and crashed the whole app (blank screen, no error boundary).
  const setOnlineTransactions = v => persist({ ...appData, onlineTransactions: typeof v === 'function' ? v(gl('onlineTransactions')) : v });
  const setAuditLogs = v => persist({ ...appData, auditLogs: typeof v === 'function' ? v(gl('auditLogs') || []) : v });
  
  // Function to add audit log entry.
  // IMPORTANT: pass the SAME payload object the calling code already built for its own
  // persist() call (the new customers/tasks/expenses/etc. list) as basePayload. The log
  // is folded into that one object and written in a SINGLE persist() call — exactly the
  // same "single atomic persist()" rule used everywhere else in this file (see
  // PendingDues.commitPayment, setAccountBalancePermanent, setOpeningBalanceFor).
  // Calling persist(payload) and then addAuditLog(...) separately (two back-to-back
  // persist() calls) makes the second call spread the FIRST call's now-stale appData,
  // silently undoing whatever the first call just saved — this was the cause of
  // "customer delete doesn't work" and "audit log shows nothing".
  const addAuditLog = (action, details = '', relatedData = '', basePayload = null) => {
    const now = new Date();
    const log = {
      id: Date.now(),
      date: todayStr,
      time: now.toLocaleTimeString('en-IN'),
      timestamp: now.getTime(),
      action: action,
      details: details + (relatedData ? ' (' + relatedData + ')' : ''),
      staffId: currentUser.id,
      staffName: currentUser.name,
      staffRole: currentUser.role
    };
    const base = basePayload || appData;
    const existing = Array.isArray(base.auditLogs) ? base.auditLogs : Object.values(base.auditLogs || {});
    persist({ ...base, auditLogs: [...existing, log] });
  };
  const setAccountBalanceExpenses = v => persist({ ...appData, accountBalanceExpenses: typeof v === 'function' ? v(appData.accountBalanceExpenses || []) : v });
  const accountBalanceOverrides = (appData && appData.accountBalanceOverrides) || {};
  const setAccountBalanceOverrides = v => persist({ ...appData, accountBalanceOverrides: typeof v === 'function' ? v(appData.accountBalanceOverrides || {}) : v });
  const setAccountBalanceArchivedOffset = v => persist({ ...appData, accountBalanceArchivedOffset: typeof v === 'function' ? v(appData.accountBalanceArchivedOffset || 0) : v });
  // Combined, atomic update used by the "Set Balance" action — folding the offset delta AND
  // clearing all overrides in a SINGLE persist() call, so one write doesn't clobber the other
  // (two separate persist() calls back-to-back would each spread the same stale appData and
  // the second call would silently wipe out the first one's change).
  const setAccountBalancePermanent = (offsetDelta) => persist({
    ...appData,
    accountBalanceArchivedOffset: (appData.accountBalanceArchivedOffset || 0) + offsetDelta,
    accountBalanceOverrides: {}
  });
  // Combined, atomic update used by "Add More Balance" — folding the Opening Balance increase
  // AND the Add-More-history entry into a SINGLE persist() call, so one write doesn't clobber
  // the other (two separate persist() calls back-to-back would each spread the same stale
  // appData and the second call would silently wipe out the first one's change — this was the
  // cause of Opening Balance not increasing while Account Balance (Auto) still decreased).
  const addMoreBalance = (date, amt) => {
    const curBalances = appData.bankingOpeningBalances || {};
    const newBal = (curBalances[date] || 0) + amt;
    const curHistory = (appData.addMoreHistory && typeof appData.addMoreHistory === 'object') ? appData.addMoreHistory : {};
    const existing = curHistory[date] || [];
    persist({
      ...appData,
      bankingOpeningBalances: { ...curBalances, [date]: newBal },
      addMoreHistory: { ...curHistory, [date]: [...existing, amt] }
    });
    return newBal;
  };
  const setOpeningBalanceFor = (date, amount) => {
    const curBalances = appData.bankingOpeningBalances || {};
    persist({ ...appData, bankingOpeningBalances: { ...curBalances, [date]: amount } });
  };
  // Net (Withdrawal − Deposit) of every archived transaction ever removed, kept forever so the
  // all-time Account Balance auto-calculation stays correct even after old entries are archived out.
  const accountBalanceArchivedOffset = (appData && appData.accountBalanceArchivedOffset) || 0;
  // "Savings Account Balance" — a separate, simple wallet (not date-scoped) tracking money sitting
  // in the CSP's own savings/bank account. It is (a) directly editable by admin from Banking, and
  // (b) auto-incremented by Customer CRM whenever a service is paid with Payment Mode = "Online".
  const savingsAccountBalance = (appData && appData.savingsAccountBalance) || 0;
  const setSavingsAccountBalance = (newVal) => persist({ ...appData, savingsAccountBalance: newVal });
  // CSC Digital Seva Wallet + Savings Expense — same simple array + setter pattern as
  // accountBalanceExpenses above, kept fully separate so nothing here can clash with it.
  const cscWalletBase = (appData && appData.cscWalletBase) || 0;
  const setCscWalletBase = (newVal) => persist({ ...appData, cscWalletBase: newVal });
  const cscWalletTopups = (appData && appData.cscWalletTopups) || [];
  const setCscWalletTopups = (v) => persist({ ...appData, cscWalletTopups: typeof v === 'function' ? v(appData.cscWalletTopups || []) : v });
  const cscWalletExpenses = (appData && appData.cscWalletExpenses) || [];
  const setCscWalletExpenses = (v) => persist({ ...appData, cscWalletExpenses: typeof v === 'function' ? v(appData.cscWalletExpenses || []) : v });
  const savingsExpenses = (appData && appData.savingsExpenses) || [];
  const setSavingsExpenses = (v) => persist({ ...appData, savingsExpenses: typeof v === 'function' ? v(appData.savingsExpenses || []) : v });
  // Archives (removes) Banking-Ledger transactions in a date range. Since each day's Opening Balance
  // is now set independently per date (not auto-summed from history), archiving old transactions has
  // zero effect on any other day's balance. Touches ONLY bankTransactions —
  // every other menu's data (tasks, customers, services, expenses) is spread through untouched.
  // The archived batch's net Withdrawal-minus-Deposit is folded into accountBalanceArchivedOffset
  // first, so the Account Balance figure does not jump when old rows disappear from the ledger.
  const archiveBankTransactions = (fromDate, toDate) => {
    const all = gl('bankTransactions');
    const toArchive = all.filter(t => t.date >= fromDate && t.date <= toDate);
    const remaining = all.filter(t => !(t.date >= fromDate && t.date <= toDate));
    const archivedWithdrawal = toArchive.reduce((s, t) => s + (t.cashOut || 0), 0);
    const archivedDeposit = toArchive.reduce((s, t) => s + (t.cashIn || 0), 0);
    persist({
      ...appData,
      bankTransactions: remaining,
      accountBalanceArchivedOffset: (appData.accountBalanceArchivedOffset || 0) + archivedWithdrawal - archivedDeposit
    });
  };
  const setBusinessProfile = v => persist({ ...appData, businessProfile: typeof v === 'function' ? v(appData.businessProfile) : v });

  const handleLogin = (userId, password) => {
    const storedUsers = gl('users') || [];
    const allUsers = storedUsers.length > 0 ? storedUsers : defaultData.users;
    const user = allUsers.find(u => u.userId === userId && u.password === password);
    if (user) {
      if (storedUsers.length === 0) persist({ ...defaultData });
      setCurrentUser(user);
      setActiveTab('dashboard');
      showMessage('Welcome, ' + user.name + '!');
    }
    else showMessage('Invalid credentials! Try: admin / 123', 'error');
  };

  if (loading) return e('div', { className: 'min-h-screen flex flex-col items-center justify-center gap-4', style: { background: '#00132f' } }, e('img', { src: SC_LOGO, alt: 'SevaCore', style: { height: 64, objectFit: 'contain' } }), e('div', { style: { animation: 'spin 1s linear infinite', display: 'inline-block', color: '#10b45f' } }, e(Icon, { name: 'RefreshCw', size: 26 })), e('p', { style: { color: '#8fa3c7' }, className: 'text-sm' }, 'Connecting...'));
  if (loadError || !appData) return e('div', { className: 'min-h-screen bg-gray-100 flex flex-col items-center justify-center gap-3' }, e(Icon, { name: 'WifiOff', size: 32 }), e('p', null, "Couldn't connect. Refresh to retry."));
  if (!currentUser) return e(LoginScreen, { onLogin: handleLogin, message });

  const users = gl('users'), services = gl('services'), tasks = gl('tasks'), customers = gl('customers'), expenses = gl('expenses'), bankTransactions = gl('bankTransactions'), cashClosingLogs = gl('cashClosingLogs');
  const { businessProfile } = appData;
  const bankingOpeningBalance = appData.bankingOpeningBalance || 0;
  const bankingOpeningBalances = appData.bankingOpeningBalances || {};

  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'tracking', label: 'Service Tracking', icon: 'Briefcase' },
    { id: 'crm', label: 'Customer CRM', icon: 'Users' },
    { id: 'reports', label: 'Reports & Invoice', icon: 'FileText' },
    { id: 'pending', label: 'Pending Amount', icon: 'AlertCircle' },
    { id: 'banking', label: 'Banking', icon: 'Landmark' },
    { id: 'online', label: 'Online Transaction', icon: 'Smartphone' },
    { id: 'expenses', label: 'Expenses', icon: 'ShoppingBag' },
    { id: 'cashclosing', label: 'Daily Cash Closing', icon: 'Calculator' },
    { id: 'sss', label: 'SSS Reports', icon: 'Shield' },
    ...(currentUser.role === 'admin' ? [
      { id: 'performance', label: 'Staff Performance', icon: 'BarChart2' },
      { id: 'auditlog', label: 'Audit Log', icon: 'LogIn' }
    ] : []),
    { id: 'salary', label: 'Staff Salary', icon: 'BadgeIndianRupee' },
  ];

  const headerTitle = { dashboard: 'Dashboard', tracking: 'Service Tracking', crm: 'Customer CRM', reports: 'Reports & Invoice', pending: 'Pending Amount', banking: 'Banking Ledger', online: 'Online Transaction', expenses: 'Expenses', cashclosing: 'Daily Cash Closing Report', sss: 'SSS Reports', performance: 'Staff Performance', auditlog: 'Audit Log', salary: 'Staff Salary Management', settings: currentUser.role === 'admin' ? 'System Settings' : 'My Settings' };

  return e('div', { className: 'flex h-screen overflow-hidden aic-main' },
    e('aside', { className: `aic-side w-64 text-white flex flex-col` },
      e('div', { className: `p-5 border-b border-${sideColor}-800` },
        e('img', { src: SC_LOGO, alt: 'SevaCore', className: 'w-full mb-3 object-contain object-left', style: { maxWidth: 216 } }),
        e('h1', { className: 'text-sm font-semibold text-white leading-tight' }, businessProfile.name),
        e('p', { className: `text-xs mt-0.5 text-${sideColor}-300` }, businessProfile.cscId),
        e('div', { className: 'flex items-center gap-2 mt-2' },
          e('span', { className: `px-2 py-0.5 text-xs rounded-full border bg-${sideColor}-800 border-${sideColor}-700` }, currentUser.role === 'admin' ? 'Admin' : 'Operator'),
          e('span', { className: `inline-flex items-center gap-1 px-2 py-0.5 text-xs rounded-full border ${syncOk ? 'bg-green-900/40 border-green-700 text-green-300' : 'bg-red-900/40 border-red-700 text-red-300'}` }, e(Icon, { name: 'Wifi', size: 11 }), syncOk ? ' Live' : ' Offline')
        )
      ),
      e('nav', { className: 'flex-1 p-3 space-y-1 overflow-y-auto' },
        ...navItems.map(n => e(NavItem, { key: n.id, icon: e(Icon, { name: n.icon, size: 18 }), label: n.label, isActive: activeTab === n.id, onClick: () => setActiveTab(n.id), sideColor })),
        e('div', { className: `pt-3 mt-3 border-t border-${sideColor}-800` },
          e(NavItem, { icon: e(Icon, { name: 'Settings', size: 18 }), label: currentUser.role === 'admin' ? 'System Settings' : 'My Settings', isActive: activeTab === 'settings', onClick: () => setActiveTab('settings'), sideColor }),
          e('button', { onClick: () => { if (window.confirm('Are you sure you want to log out?')) setCurrentUser(null); }, className: 'flex items-center w-full p-3 rounded-lg text-indigo-300 hover:bg-red-600 hover:text-white transition-colors mt-1 text-left gap-3' }, e(Icon, { name: 'LogOut', size: 18 }), e('span', { className: 'font-medium text-sm' }, 'Logout'))
        )
      ),
      e('div', { className: `p-3 text-xs border-t text-${sideColor}-400 border-${sideColor}-800` }, syncTime ? `Synced ${syncTime.toLocaleTimeString()}` : '')
    ),
    e('main', { className: 'flex-1 flex flex-col overflow-hidden relative aic-main' },
      e('header', { className: `border-b px-6 py-3 flex justify-between items-center z-10 shadow-sm transition-colors duration-300 ${isBanking ? 'bg-green-700 text-white' : isDashboard ? 'bg-purple-700 text-white' : isCashClose ? 'bg-orange-600 text-white' : 'bg-white'}` },
        e('h2', { className: `text-xl font-bold ${(isBanking || isDashboard || isCashClose) ? 'text-white' : 'text-gray-800'}` }, headerTitle[activeTab] || activeTab),
        e('div', { className: 'flex items-center gap-3' },
          e('button', {
            onClick: handleRefresh,
            title: 'Refresh Data',
            className: 'p-2 rounded-lg transition-colors ' + (isBanking ? 'text-green-100 hover:bg-green-600' : 'text-gray-500 hover:bg-gray-100')
          }, e(Icon, { name: 'RefreshCw', size: 18 })),
          e('button', {
            onClick: toggleFullscreen,
            title: isFullscreen ? 'Exit Fullscreen' : 'Fullscreen',
            className: 'p-2 rounded-lg transition-colors ' + (isBanking ? 'text-green-100 hover:bg-green-600' : 'text-gray-500 hover:bg-gray-100')
          }, e(Icon, { name: isFullscreen ? 'Minimize2' : 'Maximize2', size: 18 })),
          e('div', { className: 'h-px w-px mx-1' }),
          e('div', { className: 'text-right' },
            e('p', { className: `text-sm font-semibold ${(isBanking||isDashboard||isCashClose)?'text-white':'text-gray-800'}` }, currentUser.name),
            e('p', { className: `text-xs capitalize ${isBanking?'text-green-200':isDashboard?'text-purple-200':isCashClose?'text-orange-100':'text-gray-500'}` }, currentUser.role)
          ),
          e('div', { className: `h-10 w-10 rounded-full flex items-center justify-center font-bold border ${isBanking?'bg-green-600 text-white border-green-500':isDashboard?'bg-purple-600 text-white border-purple-500':isCashClose?'bg-orange-500 text-white border-orange-400':'bg-indigo-100 text-indigo-600 border-indigo-200'}` }, currentUser.name.charAt(0))
        )
      ),
      message && e('div', { className: `absolute top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg font-medium text-white ${message.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`, style: { whiteSpace: 'nowrap' } }, message.text),
      e('div', { className: 'flex-1 overflow-y-auto p-6 relative' },
        activeTab === 'dashboard' && e(Dashboard, { tasks, customers, currentUser, setPrintingReceipt, expenses }),
        activeTab === 'tracking' && e(ServiceTracking, { tasks, setTasks, customers, setCustomers, appData, persist, services, showMessage, currentUser, setPrintingReceipt }),
        activeTab === 'crm' && e(CustomerCRM, { customers, setCustomers, services, tasks, setTasks, appData, persist, showMessage, currentUser, setPrintingReceipt, addAuditLog, editRequestId, clearEditRequest: () => setEditRequestId(null) }),
        activeTab === 'reports' && e(ReportsInvoices, { tasks, setTasks, customers, setCustomers, appData, persist, businessProfile, setPrintingReceipt, currentUser }),
        activeTab === 'pending' && e(PendingDues, { tasks, setTasks, customers, appData, persist, showMessage, addAuditLog, setPrintingReceipt, goAddService }),
        activeTab === 'banking' && e(BankingLedger, { bankTransactions, setBankTransactions, tasks, openingBalances: bankingOpeningBalances, setOpeningBalances: setBankingOpeningBalances, setOpeningBalanceFor, archiveBankTransactions, addMoreHistory, setAddMoreHistory, addMoreBalance, onlineTransactions, accountBalanceExpenses: appData.accountBalanceExpenses || [], setAccountBalanceExpenses, accountBalanceOverrides, setAccountBalanceOverrides, accountBalanceArchivedOffset, setAccountBalanceArchivedOffset, setAccountBalancePermanent, savingsAccountBalance, setSavingsAccountBalance, cscWalletBase, setCscWalletBase, cscWalletTopups, setCscWalletTopups, cscWalletExpenses, setCscWalletExpenses, savingsExpenses, setSavingsExpenses, currentUser, showMessage, businessProfile }),
        activeTab === 'online'   && e(OnlineTransaction, { onlineTransactions, setOnlineTransactions, appData, currentUser, showMessage, addAuditLog }),
        activeTab === 'expenses' && e(Expenses, { expenses, setExpenses, appData, currentUser, showMessage, addAuditLog }),
        activeTab === 'cashclosing' && e(DailyCashClosing, { tasks, expenses, bankTransactions, bankingOpeningBalances, cashClosingLogs, setCashClosingLogs, onlineTransactions, customers, currentUser, showMessage, businessProfile }),
        activeTab === 'sss' && e(SSSReports, { appData, persist, currentUser, showMessage }),
        activeTab === 'performance' && currentUser.role === 'admin' && e(StaffPerformance, { tasks, users, expenses }),
        activeTab === 'auditlog' && currentUser.role === 'admin' && e(AuditLog, { auditLogs: gl('auditLogs') || [] }),
        activeTab === 'salary'      && activeTab === 'salary' && e(StaffSalary, { users, appData, persist, showMessage, currentUser, businessProfile }),
        activeTab === 'settings' && e(SystemSettings, { currentUser, users, setUsers, services, setServices, businessProfile, setBusinessProfile, showMessage })
      )
    ),
    printingReceipt && e(ReceiptModal, { receipt: printingReceipt, businessProfile, onClose: () => setPrintingReceipt(null) })
  );
}

ReactDOM.render(e(App, null), document.getElementById('root'));
</script>
</body>
</html>
