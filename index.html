<script>

// Formats a rupee amount so negative values read as "-₹1234" (not "₹-1234").
function fmtR(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-₹' : '₹') + Math.abs(v);
}
// Same, but also prefixes a "+" for positive values (used for "Difference" style figures).
function fmtRSigned(n) {
  const v = Number(n) || 0;
  if (v > 0) return '+₹' + v;
  if (v < 0) return '-₹' + Math.abs(v);
  return '₹0';
}

function exportToExcel(data, filename) {
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename + '.xlsx');
}

// ── PDF GENERATION (single page, compact) ──
function generateCashClosingPDF(data, businessProfile, isAdmin) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pw = doc.internal.pageSize.getWidth();
  const ph = doc.internal.pageSize.getHeight(); // 297mm
  let y = 0;

  // ── Header bar ──
  doc.setFillColor(67, 56, 202);
  doc.rect(0, 0, pw, 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text(businessProfile.name, pw/2, 9, { align: 'center' });
  doc.setFontSize(7); doc.setFont(undefined,'normal');
  doc.text(businessProfile.address + '  |  Ph: ' + businessProfile.phone + '  |  ' + businessProfile.cscId, pw/2, 14, { align: 'center' });
  doc.text('DAILY CASH CLOSING REPORT  —  ' + data.date, pw/2, 19, { align: 'center' });
  y = 25;

  // ── Summary + Day Overview side by side ──
  // Left: Summary (col 10..105), Right: Day overview (col 108..200)
  const leftX = 10, midX = 105, rightX = 108, rightW = pw - rightX - 5;

  const sumRows = [
    ...(isAdmin ? [['Total Income (all modes)', fmtR(data.totalIncome), false]] : []),
    ['(-) Total Expense', fmtR(data.expenseTotal), false],
    ...(isAdmin ? [['= Net Profit (business, ref. only)', fmtR(data.netProfit), true]] : []),
    ['Cash Profit (Cash-mode only)', fmtR(data.cashProfitToday), false],
    ['(+) Banking Balance', fmtR(data.bankingCurrentBalance), false],
    ['= Expected Closing', fmtR(data.expectedClosing), true],
    ['Actual Cash Counted', fmtR(data.actualCash), true],
    ['Difference', fmtRSigned(data.difference), true],
  ];
  const ov = data.dayOverview;
  const ovRows = ov ? [
    ['Customers Served', ov.customersServed],
    ['New Customers', ov.newCustomers],
    ['Successful Tasks', ov.successfulTasks],
    ['Pending Tasks', ov.pendingTasks],
    ['Processing Tasks', ov.processingTasks],
    ['Banking Txns', ov.bankTxns],
    ['Pending Dues', '₹' + ov.pendingAmount],
  ] : [];
  // Both boxes share one height, tall enough for whichever side has more rows —
  // so the Cash Profit row added above never overflows the box outline.
  const boxH = 10 + Math.max(sumRows.length, ovRows.length) * 7.2 + 4;

  doc.setFillColor(238,242,255);
  doc.roundedRect(leftX, y, midX - leftX, boxH, 2, 2, 'F');
  doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
  doc.text('Cash Reconciliation', leftX + (midX-leftX)/2, y+5, { align: 'center' });

  doc.setFontSize(7);
  sumRows.forEach((r, i) => {
    const ry = y + 10 + i * 7.2;
    if (i % 2 === 0) { doc.setFillColor(230,235,255); doc.rect(leftX+1, ry-3.5, midX-leftX-2, 7, 'F'); }
    doc.setFont(undefined, r[2] ? 'bold' : 'normal');
    const diffCol = r[0] === 'Difference' ? (data.difference < 0 ? [220,38,38] : data.difference > 0 ? [37,99,235] : [22,163,74]) : [30,30,30];
    doc.setTextColor(...diffCol);
    doc.text(r[0], leftX+3, ry);
    doc.text(r[1], midX-3, ry, { align: 'right' });
  });

  // Right: Day Overview
  if (data.dayOverview) {
    doc.setFillColor(240,253,244);
    doc.roundedRect(rightX, y, rightW, boxH, 2, 2, 'F');
    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(22,163,74);
    doc.text('Day Overview', rightX + rightW/2, y+5, { align: 'center' });
    doc.setFontSize(7);
    ovRows.forEach((r, i) => {
      const ry = y + 10 + i * 7.2;
      if (i % 2 === 0) { doc.setFillColor(220,252,231); doc.rect(rightX+1, ry-3.5, rightW-2, 7, 'F'); }
      doc.setFont(undefined,'normal'); doc.setTextColor(30,30,30);
      doc.text(String(r[0]), rightX+3, ry);
      doc.setFont(undefined,'bold');
      doc.text(String(r[1]), rightX+rightW-3, ry, { align: 'right' });
    });
  }
  y += boxH + 4;

  // ── Note ──
  if (data.note) {
    doc.setFontSize(7.5); doc.setFont(undefined,'bold'); doc.setTextColor(80,80,80);
    doc.text('Note: ', leftX, y+4);
    doc.setFont(undefined,'normal'); doc.text(data.note, leftX+12, y+4);
    y += 8;
  }

  // ── Service Collections (compact table) ──
  if (data.serviceGroups && data.serviceGroups.length > 0) {
    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
    doc.text('Service Collections', leftX, y+5); y += 7;
    doc.autoTable({
      startY: y, margin: { left: leftX, right: 5 }, theme: 'grid',
      headStyles: { fillColor: [67,56,202], textColor: 255, fontSize: 6.5, fontStyle: 'bold', cellPadding: 1.5 },
      bodyStyles: { fontSize: 6.5, cellPadding: 1.5 },
      alternateRowStyles: { fillColor: [238,242,255] },
      head: [['Customer', 'Service(s)', 'Total', 'Paid', 'Due', 'Status']],
      body: data.serviceGroups.map(g => [
        g.customerName,
        g.items.map(i => i.service).join(', ').substring(0, 40),
        '₹'+g.totalAmount, '₹'+g.totalPaid,
        g.totalDue > 0 ? '₹'+g.totalDue : '—', g.status
      ]),
      columnStyles: { 1: { cellWidth: 55 } }
    });
    y = doc.lastAutoTable.finalY + 3;
  }

  // ── Expenses + Banking side by side (if both exist) or stacked ──
  const hasExp = data.todaysExpenses && data.todaysExpenses.length > 0;

  if (hasExp) {
    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(220,38,38);
    doc.text('Expenses', leftX, y+5); y += 7;
    doc.autoTable({
      startY: y, margin: { left: leftX, right: 5 }, theme: 'grid',
      headStyles: { fillColor: [220,38,38], textColor: 255, fontSize: 6.5, fontStyle: 'bold', cellPadding: 1.5 },
      bodyStyles: { fontSize: 6.5, cellPadding: 1.5 }, alternateRowStyles: { fillColor: [254,242,242] },
      head: [['Expense Name', 'Remarks', 'Cost', 'By']],
      body: data.todaysExpenses.map(x => [x.name, x.remarks||'—', '₹'+x.cost, x.staffName||x.addedBy||'—'])
    });
    y = doc.lastAutoTable.finalY + 3;
  }

  // ── Banking Transactions — summary only (Opening Balance, Txn Count, Current Bank Cash,
  //    No. of Withdrawals + Total, No. of Deposits + Total, Total Turnover) — no serial-no-wise listing ──
  {
    const bankRows = data.bankRows || [];
    const totalWithdrawalAmt = bankRows.reduce((s, t) => s + (t.cashOut || 0), 0);
    const totalDepositAmt = bankRows.reduce((s, t) => s + (t.cashIn || 0), 0);
    const withdrawalCount = bankRows.filter(t => (t.cashOut || 0) > 0).length;
    const depositCount = bankRows.filter(t => (t.cashIn || 0) > 0).length;
    const totalTurnover = totalDepositAmt + totalWithdrawalAmt;
    const currentBankCash = (data.bankingCurrentBalance !== undefined) ? data.bankingCurrentBalance : (totalDepositAmt - totalWithdrawalAmt);
    const openingBal = (data.bankingOpeningBalance !== undefined) ? data.bankingOpeningBalance : (currentBankCash - totalDepositAmt + totalWithdrawalAmt);

    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(37,99,235);
    doc.text('Banking Transactions', leftX, y+5); y += 7;

    // Row 1 — Opening Balance | No. of Transactions | Current Bank Cash
    const stripW = pw - leftX - 5;
    doc.setFillColor(239,246,255);
    doc.roundedRect(leftX, y, stripW, 14, 2, 2, 'F');
    const cellW = stripW / 3;
    const stripItems = [
      ['Opening Balance', '₹' + openingBal],
      ['No. of Transactions', String(bankRows.length)],
      ['Current Bank Cash', '₹' + currentBankCash]
    ];
    stripItems.forEach((item, i) => {
      const cx = leftX + cellW * i + cellW / 2;
      doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(90,90,90);
      doc.text(item[0], cx, y + 5.5, { align: 'center' });
      doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(37,99,235);
      doc.text(item[1], cx, y + 11, { align: 'center' });
    });
    y += 17;

    // Row 2 — No. of Withdrawals + Total | No. of Deposits + Total | Total Turnover
    const gap2 = 5;
    const boxW = (stripW - gap2 * 2) / 3;

    doc.setFillColor(254,242,242);
    doc.roundedRect(leftX, y, boxW, 16, 2, 2, 'F');
    doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(153,27,27);
    doc.text('Withdrawals', leftX + boxW/2, y + 5.5, { align: 'center' });
    doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(220,38,38);
    doc.text(withdrawalCount + ' txns  ·  ₹' + totalWithdrawalAmt, leftX + boxW/2, y + 11.5, { align: 'center' });

    const depX = leftX + boxW + gap2;
    doc.setFillColor(240,253,244);
    doc.roundedRect(depX, y, boxW, 16, 2, 2, 'F');
    doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(22,101,52);
    doc.text('Deposits', depX + boxW/2, y + 5.5, { align: 'center' });
    doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(22,163,74);
    doc.text(depositCount + ' txns  ·  ₹' + totalDepositAmt, depX + boxW/2, y + 11.5, { align: 'center' });

    const turnX = depX + boxW + gap2;
    doc.setFillColor(238,242,255);
    doc.roundedRect(turnX, y, boxW, 16, 2, 2, 'F');
    doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(67,56,202);
    doc.text('Total Turnover', turnX + boxW/2, y + 5.5, { align: 'center' });
    doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
    doc.text('₹' + totalTurnover, turnX + boxW/2, y + 11.5, { align: 'center' });

    y += 21;
  }

  // ── Signature at fixed bottom position ──
  const sigY = ph - 38;
  doc.setDrawColor(180,180,180);
  doc.line(leftX, sigY, pw-5, sigY);

  doc.setFontSize(7); doc.setFont(undefined,'normal'); doc.setTextColor(100,100,100);
  doc.text('Closed by: ' + data.closedBy + '   |   Date: ' + data.date, leftX, sigY+4);

  // Single signature box — "Manager Signature With Seal"
  const sigBoxW = 80;
  const sigBoxX = pw/2 - sigBoxW/2;
  const sigBoxY = sigY + 8;
  doc.setFillColor(248,250,252);
  doc.roundedRect(sigBoxX, sigBoxY, sigBoxW, 24, 2, 2, 'F');
  doc.setDrawColor(150,150,150); doc.roundedRect(sigBoxX, sigBoxY, sigBoxW, 24, 2, 2, 'S');
  doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
  doc.text('Manager Signature With Seal', pw/2, sigBoxY+5, { align: 'center' });
  doc.setDrawColor(180,180,180); doc.setLineDash([1,1]);
  doc.line(sigBoxX+8, sigBoxY+19, sigBoxX+sigBoxW-8, sigBoxY+19);
  doc.setLineDash([]);
  doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(150,150,150);
  doc.text('Authorized Signature & Official Seal', pw/2, sigBoxY+23, { align: 'center' });

  // Footer
  doc.setFontSize(6); doc.setTextColor(180,180,180);
  doc.text('Generated by CSC Management System — ' + new Date().toLocaleString(), pw/2, ph-3, { align: 'center' });

  doc.save('Cash_Closing_Report_' + data.date + '.pdf');
}

// ── GROUPING HELPERS ──
// Multiple services added together for one customer share the same groupId.
// These helpers combine them back into a single logical entry (one receipt,
// one row) wherever tasks are listed, instead of showing each service separately.
function groupTasks(taskList) {
  const map = {};
  (taskList || []).forEach(t => {
    const gid = (t.groupId !== undefined && t.groupId !== null) ? t.groupId : ('single-' + t.id);
    if (!map[gid]) map[gid] = { groupId: gid, customerId: t.customerId, customerName: t.customerName, date: t.date, staffName: t.staffName, items: [] };
    map[gid].items.push(t);
    if (t.date > map[gid].date) map[gid].date = t.date;
  });
  return Object.values(map).map(g => {
    const totalAmount = g.items.reduce((s, i) => s + (i.price || 0), 0);
    const totalPaid = g.items.reduce((s, i) => s + (i.paidAmount || 0), 0);
    const totalDue = Math.max(0, totalAmount - totalPaid);
    let status = 'Successful';
    if (g.items.some(i => i.status === 'Pending')) status = 'Pending';
    else if (g.items.some(i => i.status === 'Processing')) status = 'Processing';
    return { ...g, totalAmount, totalPaid, totalDue, status };
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (String(b.groupId)).localeCompare(String(a.groupId))));
}

// ── ONLINE-PAID HELPER ──
// How much of a task's money actually reached the Savings Account Balance, i.e. was paid
// in "Online" mode. Two separate sources now:
//   (a) the initial payment made at entry time in Customer CRM — that is paidAmount minus
//       every later paymentHistory entry — counted only when the row's paymentMode is "Online";
//   (b) every later due-clearance recorded from the Pending Amount menu that was marked
//       Online (each paymentHistory entry now carries its own `mode`).
// Older paymentHistory entries saved before this feature existed have no `mode` field and
// are treated as Cash, exactly as they were handled before.
// Every delete handler uses this so removing an entry reverses precisely what was added.
function onlinePaidOf(t) {
  if (!t) return 0;
  const hist = t.paymentHistory || [];
  const laterTotal = hist.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const initialPaid = Math.max(0, (Number(t.paidAmount) || 0) - laterTotal);
  const initialOnline = (t.paymentMode === 'Online') ? initialPaid : 0;
  const historyOnline = hist.reduce((s, p) => s + ((p.mode === 'Online') ? (Number(p.amount) || 0) : 0), 0);
  return initialOnline + historyOnline;
}

function receiptFromGroup(g) {
  return {
    groupId: g.groupId, customerName: g.customerName, date: g.date,
    items: g.items.map(i => ({ service: i.service, price: i.price || 0, paidAmount: i.paidAmount || 0 })),
    totalAmount: g.totalAmount, totalPaid: g.totalPaid, totalDue: g.totalDue
  };
}

// Builds a combined receipt for a customer's full visit (used from the CRM list,
// where we only have the customer record, not a pre-grouped task list).
function getCustomerReceipt(customer, tasks) {
  const items = (tasks || []).filter(t =>
    (t.customerId !== undefined && t.customerId !== null && t.customerId === customer.id) ||
    ((t.groupId !== undefined && t.groupId !== null) ? t.groupId === customer.id
      : (t.customerName === customer.name && t.date === customer.lastVisit))
  );
  const totalAmount = items.reduce((s, i) => s + (i.price || 0), 0);
  const totalPaid = items.reduce((s, i) => s + (i.paidAmount || 0), 0);
  return {
    groupId: customer.id, customerName: customer.name, date: customer.lastVisit,
    items: items.map(i => ({ service: i.service, price: i.price || 0, paidAmount: i.paidAmount || 0 })),
    totalAmount, totalPaid, totalDue: Math.max(0, totalAmount - totalPaid)
  };
}

// ── CUSTOMER ID HELPERS ──
// Every real customer has ONE permanent record (customer.id, numeric, never reused) and a
// human-friendly custCode ("CUS-0001") shown in the UI. Name/phone are normalised only for
// MATCHING (finding duplicates, searching) — the stored name/phone strings are never altered.
function _normName(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function _normPhone(s) { return String(s || '').replace(/\D/g, ''); }

// Every task this customer has ever had, across every visit — same matching chain as
// getCustomerReceipt above (customerId, then groupId, then name+date for very old tasks).
function tasksOfCustomer(customer, tasks) {
  return (tasks || []).filter(t =>
    (t.customerId !== undefined && t.customerId !== null && t.customerId === customer.id) ||
    ((t.groupId !== undefined && t.groupId !== null) ? t.groupId === customer.id
      : (t.customerName === customer.name && t.date === customer.lastVisit))
  );
}

// ── ONE-TIME CUSTOMER ID MIGRATION ──
// Before this feature, every "Add Customer" click created a brand-new customer record even
// for someone who had already visited — so the same real person could end up with several
// duplicate records. This runs ONCE (guarded by customerIdMigrationDone) to:
//   1. Merge duplicate records that share the same name AND phone, UNLESS they have a
//      conflicting DOB on file (name+phone match but different recorded DOB → kept separate,
//      exactly as agreed, since that's good evidence they're actually different people).
//   2. Give every surviving customer a permanent, sequential Customer ID (CUS-0001, CUS-0002…)
//      in order of their earliest visit — oldest customer gets the lowest number.
//   3. Re-point every task's customerId at the surviving record, backfilling it from groupId
//      or (as a last resort) a unique name match for older tasks that predate this field.
// Pure function of its input, so it's safe even if two devices happen to run it at once —
// both compute the identical result.
function migrateCustomerIds(data) {
  const arrOf = (v) => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
  const customersIn = arrOf(data.customers);
  const tasksIn = arrOf(data.tasks);

  // 1) Bucket customers by name+phone; a conflicting DOB splits a record into its own bucket.
  const buckets = [];
  customersIn.forEach(c => {
    const key = _normName(c.name) + '|' + _normPhone(c.phone);
    let bucket = buckets.find(b => b.key === key && !(
      (c.dob || '').trim() && b.members.some(m => (m.dob || '').trim() && m.dob !== c.dob)
    ));
    if (!bucket) { bucket = { key, members: [] }; buckets.push(bucket); }
    bucket.members.push(c);
  });

  // 2) One surviving record per bucket. Earliest id is canonical (oldest = first ever visit);
  //    address/DOB backfilled from any member that has them; service/lastVisit from the latest.
  const idRemap = {};
  let mergedAway = 0;
  const survivors = buckets.map(bucket => {
    const members = bucket.members.slice().sort((a, b) => (a.id || 0) - (b.id || 0));
    const survivor = members[0];
    members.forEach(m => { idRemap[m.id] = survivor.id; });
    if (members.length > 1) mergedAway += members.length - 1;
    const latest = members.slice().sort((a, b) => (a.lastVisit || '') < (b.lastVisit || '') ? 1 : -1)[0];
    const withAddr = members.find(m => (m.address || '').trim());
    const withDob = members.find(m => (m.dob || '').trim());
    return {
      ...survivor,
      address: (withAddr ? withAddr.address : survivor.address) || '',
      dob: (withDob ? withDob.dob : survivor.dob) || '',
      service: latest.service || survivor.service || '',
      lastVisit: latest.lastVisit || survivor.lastVisit || todayStr
    };
  });

  // 3) Assign CUS-0001, CUS-0002… oldest first, then store newest-first (matches the app's
  //    existing "prepend new customer" convention, so the CRM list order doesn't change).
  survivors.sort((a, b) => (a.id || 0) - (b.id || 0));
  survivors.forEach((c, i) => { c.custCode = 'CUS-' + String(i + 1).padStart(4, '0'); });
  const customersOut = survivors.slice().sort((a, b) => (b.id || 0) - (a.id || 0));

  // 4) Backfill every task's customerId through the remap (or by groupId / a unique name
  //    match) so ALL of a customer's history is reliably linked to their one permanent id.
  const byNameLower = {};
  survivors.forEach(c => { const k = _normName(c.name); (byNameLower[k] = byNameLower[k] || []).push(c); });
  const tasksOut = tasksIn.map(t => {
    let cid;
    if (t.customerId !== undefined && t.customerId !== null && idRemap[t.customerId] !== undefined) cid = idRemap[t.customerId];
    else if (t.groupId !== undefined && t.groupId !== null && idRemap[t.groupId] !== undefined) cid = idRemap[t.groupId];
    else { const matches = byNameLower[_normName(t.customerName)] || []; if (matches.length === 1) cid = matches[0].id; }
    return cid !== undefined ? { ...t, customerId: cid } : t;
  });

  const now = new Date();
  const auditLogsIn = arrOf(data.auditLogs);
  return {
    ...data,
    customers: customersOut,
    tasks: tasksOut,
    customerIdMigrationDone: true,
    customerIdSeq: survivors.length + 1,
    auditLogs: [...auditLogsIn, {
      id: now.getTime(), date: todayStr, time: now.toLocaleTimeString('en-IN'), timestamp: now.getTime(),
      action: 'Customer ID Migration',
      details: 'One-time setup: ' + customersIn.length + ' customer record(s) → ' + survivors.length + ' unique customer(s) (' + mergedAway + ' duplicate record(s) merged). Every customer now has a permanent Customer ID.',
      staffId: 0, staffName: 'System', staffRole: 'admin'
    }]
  };
}

// Click-to-chat: opens the customer's WhatsApp chat with the message already typed in
// (wa.me link). WhatsApp itself then needs one tap on "Send" — fully automatic sending
// without that tap needs the paid WhatsApp Business API, which a plain web app can't do.
const DEFAULT_WA_TEMPLATES = [
  { id: 'due',      title: 'Payment Due Reminder',  text: 'Hello {name}, this is a reminder from {shop} that ₹{due} is due for your {service} service. Please make the payment at your earliest convenience. Thank you. 📞 {shop_phone}' },
  { id: 'done',     title: 'Service Completed',     text: 'Hello {name}, your {service} work has been completed. Please collect your documents from the centre. Thank you — {shop}' },
  { id: 'progress', title: 'Application In Progress', text: 'Hello {name}, your {service} application is currently in process. You will be notified once it is completed. Thank you — {shop}' },
  { id: 'docs',     title: 'Documents Required',    text: 'Hello {name}, some documents are required for your {service}. Please contact the centre as soon as possible. — {shop}, 📞 {shop_phone}' },
  { id: 'thanks',   title: 'Thank You',             text: 'Thank you {name}! We are grateful for using {shop} services. Please visit us again. 🙏' },
  { id: 'bday',     title: 'Birthday Wish',         text: 'Happy Birthday {name}! 🎂 Warm wishes and love from {shop}.' },
  { id: 'closed',   title: 'Shop Closed Notice',    text: 'Hello {name}, please be informed that {shop} will remain closed tomorrow. We apologise for the inconvenience. Thank you.' }
];

function getWaTemplates(appData) {
  const raw = appData && appData.whatsappTemplates;
  const arr = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' ? Object.values(raw) : []);
  const clean = arr.filter(t => t && t.text);
  return clean.length ? clean : DEFAULT_WA_TEMPLATES;
}

// Normalises an Indian mobile number to WhatsApp's international format (no + or spaces).
// Returns '' if it doesn't look like a valid number.
function waPhone(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
  if (d.length === 10) d = '91' + d;
  return (d.length >= 11 && d.length <= 15) ? d : '';
}

// Values available inside a template: {name} {due} {service} {shop} {shop_phone} {date}
function waVars(customer, tasks, businessProfile) {
  const bp = businessProfile || {};
  // customerId-based match so two customers who happen to share a name never get each
  // other's dues mixed into their WhatsApp message; falls back to name for any task that
  // predates the Customer ID field.
  const mine = (tasks || []).filter(t =>
    (t.customerId !== undefined && t.customerId !== null) ? t.customerId === customer.id : t.customerName === customer.name
  );
  const dueOf = t => Math.max(0, (Number(t.price) || 0) - (Number(t.paidAmount) || 0));
  const due = mine.reduce((s, t) => s + dueOf(t), 0);
  let items = mine.filter(t => dueOf(t) > 0);
  if (!items.length) { const last = mine.reduce((m, t) => (t.date > m ? t.date : m), ''); items = mine.filter(t => t.date === last); }
  const service = items.map(t => t.service).filter((v, i, a) => v && a.indexOf(v) === i).join(', ') || customer.service || '';
  return { name: customer.name || '', due: String(due), service, shop: bp.name || '', shop_phone: bp.phone || '', date: todayStr };
}
function waFill(text, vars) {
  return String(text || '').replace(/\{(name|due|service|shop|shop_phone|date)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : ''));
}
function openWhatsApp(phone, text) {
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

            e('button', { disabled: draft.length <= 1, onClick: () => remove(i), className: 'text-red-500 bg-red-50 px-3 rounded-lg text-sm ' + (draft.length <= 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-red-100') }, 'Delete')
          ),
          e('textarea', { value: t.text, onChange: ev => update(i, 'text', ev.target.value), rows: 3, className: 'w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-green-500', placeholder: 'Message text…' })
        )),
        e('button', { onClick: add, className: 'text-green-700 border border-green-300 bg-green-50 hover:bg-green-100 px-4 py-2 rounded-lg text-sm font-medium' }, '+ Add Message')
      ),
      e('div', { className: 'px-5 py-3 border-t bg-gray-50 rounded-b-2xl flex justify-end gap-2' },
        e('button', { onClick: () => setDraft(DEFAULT_WA_TEMPLATES.map(t => ({ ...t }))), className: 'text-gray-600 bg-white border px-4 py-2 rounded-lg text-sm' }, 'Reset to defaults'),
        e('button', { onClick: onClose, className: 'text-gray-600 bg-white border px-4 py-2 rounded-lg text-sm' }, 'Cancel'),
        e('button', { onClick: save, className: 'bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg text-sm font-medium' }, 'Save')
      )
    )
  );
}

// ── CUSTOMER CRM ──
// ── CUSTOMER MERGE MODAL (Admin only) ──
// Merges TWO customers into ONE. Rules:
//  • All tasks of BOTH customers are re-pointed to the winner's id/name.
//  • The winner's profile fields are kept (name, phone, address, dob, custCode, etc.)
//    unless the admin explicitly picks a field from the other customer.
//  • The loser record is removed from the customers array.
//  • No money, savings-balance, or other menu data is touched.
function CustomerMergeModal({ customers, tasks, appData, persist, showMessage, addAuditLog, onClose }) {
  const [step, setStep]         = useState(1);          // 1=pick A, 2=pick B, 3=confirm
  const [custA, setCustA]       = useState(null);
  const [custB, setCustB]       = useState(null);
  const [searchA, setSearchA]   = useState('');
  const [searchB, setSearchB]   = useState('');
  // winner = which customer's profile to keep (A or B); the other's tasks flow into it.
  const [winner, setWinner]     = useState('A');
  // field overrides: if admin wants a specific field from the *loser*, toggle it here.
  const [fieldOverrides, setFieldOverrides] = useState({});

  const profileFields = [
    { key: 'name',      label: 'Name'      },
    { key: 'phone',     label: 'Mobile'    },
    { key: 'altPhone',  label: 'Alt Mobile'},
    { key: 'address',   label: 'Address'   },
    { key: 'dob',       label: 'DOB'       },
    { key: 'gender',    label: 'Gender'    },
    { key: 'village',   label: 'Village'   },
    { key: 'post',      label: 'Post'      },
    { key: 'city',      label: 'City'      },
    { key: 'pin',       label: 'PIN'       },
    { key: 'doc1Type',  label: 'Doc1 Type' },
    { key: 'doc1Number',label: 'Doc1 No.'  },
    { key: 'doc2Type',  label: 'Doc2 Type' },
    { key: 'doc2Number',label: 'Doc2 No.'  },
    { key: 'notes',     label: 'Notes'     },
  ];

  const filtA = customers.filter(c =>
    !searchA || c.name.toLowerCase().includes(searchA.toLowerCase()) ||
    (c.phone || '').includes(searchA) || (c.custCode || '').toLowerCase().includes(searchA.toLowerCase())
  );
  const filtB = customers.filter(c =>
    c.id !== (custA ? custA.id : null) &&
    (!searchB || c.name.toLowerCase().includes(searchB.toLowerCase()) ||
    (c.phone || '').includes(searchB) || (c.custCode || '').toLowerCase().includes(searchB.toLowerCase()))
  );

  const winnerCust  = winner === 'A' ? custA  : custB;
  const loserCust   = winner === 'A' ? custB  : custA;

  // Build the merged profile: start with winner, apply any field overrides from loser.
  const buildMergedProfile = () => {
    if (!winnerCust || !loserCust) return null;
    const merged = { ...winnerCust };
    profileFields.forEach(({ key }) => {
      if (fieldOverrides[key]) merged[key] = loserCust[key] || '';
    });
    // Combine service tags (deduplicated, trimmed)
    const winSvcs = (winnerCust.service || '').split(',').map(s => s.trim()).filter(Boolean);
    const losSvcs = (loserCust.service  || '').split(',').map(s => s.trim()).filter(Boolean);
    const allSvcs = [...new Set([...winSvcs, ...losSvcs])];
    merged.service   = allSvcs.join(', ');
    // Keep the earliest lastVisit between the two so no history is hidden.
    // (The most-recent visit should already be on the winner but let's keep all.)
    merged.lastVisit = [winnerCust.lastVisit, loserCust.lastVisit].filter(Boolean).sort().pop() || winnerCust.lastVisit;
    return merged;
  };

  const handleMerge = () => {
    const merged = buildMergedProfile();
    if (!merged) return;

    // Re-point all loser's tasks → winner's id/name (group-level and individual-level).
    const loserTaskIds = new Set(
      tasks.filter(t => {
        const byGroup    = (t.groupId    !== undefined && t.groupId    !== null) ? t.groupId    === loserCust.id : false;
        const byCustomer = (t.customerId !== undefined && t.customerId !== null) ? t.customerId === loserCust.id : false;
        const byNameDate = t.customerName === loserCust.name;
        return byGroup || byCustomer || byNameDate;
      }).map(t => t.id)
    );

    const newTasks = tasks.map(t => {
      if (!loserTaskIds.has(t.id)) return t;
      return {
        ...t,
        customerName: merged.name,
        // groupId and customerId that pointed to the loser now point to the winner.
        ...(t.groupId    === loserCust.id ? { groupId:    winnerCust.id } : {}),
        ...(t.customerId === loserCust.id ? { customerId: winnerCust.id } : {}),
      };
    });

    const newCustomers = customers
      .filter(c => c.id !== loserCust.id)
      .map(c  => c.id === winnerCust.id ? merged : c);

    const payload = { ...appData, customers: newCustomers, tasks: newTasks };
    addAuditLog && addAuditLog(
      'Customer Merged',
      (loserCust.custCode || loserCust.name) + ' → ' + (winnerCust.custCode || winnerCust.name),
      'Tasks reassigned: ' + loserTaskIds.size + ' | Loser ID: ' + loserCust.id
    );
    persist(payload);
    showMessage('Merge Done! ' + loserCust.name + '-All services are now under ' + merged.name + '-');
    onClose();
  };

  const MiniCard = ({ c, highlight }) => e('div', {
    className: 'p-3 rounded-xl border-2 text-sm ' + (highlight ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 bg-white')
  },
    e('div', { className: 'flex items-center gap-2 mb-1' },
      e('div', { className: 'h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-sm' }, (c.name||'?').charAt(0)),
      e('div', null,
        e('p', { className: 'font-semibold text-gray-800 leading-tight' }, c.name),
        e('p', { className: 'text-xs text-gray-500' }, c.custCode || '', ' • ', c.phone || '')
      )
    ),
    e('p', { className: 'text-xs text-gray-400 mt-1' }, 'Services: ' + (c.service || '—').slice(0, 60) + ((c.service||'').length > 60 ? '…' : ''))
  );

  return e('div', { className: 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4' },
    e('div', { className: 'bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]' },

      // ── Header ──
      e('div', { className: 'bg-indigo-700 px-6 py-4 flex justify-between items-center' },
        e('div', null,
          e('h3', { className: 'text-white font-bold text-lg' }, 'Customer Merge'),
          e('p', { className: 'text-indigo-200 text-sm' }, 'Merge two customer profiles — keeping all services & history')
        ),
        e('button', { onClick: onClose, className: 'text-white hover:bg-indigo-600 p-2 rounded-lg' }, e(Icon, { name: 'X', size: 20 }))
      ),

      e('div', { className: 'overflow-y-auto flex-1 p-6 space-y-5' },

        // ── Step 1: Pick Customer A ──
        e('div', { className: 'space-y-2' },
          e('div', { className: 'flex items-center gap-2' },
            e('span', { className: 'w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center' }, '1'),
            e('label', { className: 'font-semibold text-gray-700' }, 'Select First Customer')
          ),
          custA
            ? e('div', { className: 'flex items-center gap-3' },
                e(MiniCard, { c: custA, highlight: true }),
                e('button', { onClick: () => { setCustA(null); setStep(1); }, className: 'text-xs text-red-500 hover:underline whitespace-nowrap' }, 'Change')
              )
            : e('div', { className: 'space-y-2' },
                e('input', { type: 'text', value: searchA, onChange: ev => setSearchA(ev.target.value), placeholder: 'Search by Name / Mobile / Customer ID…', className: 'w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500' }),
                e('div', { className: 'max-h-40 overflow-y-auto space-y-1.5 border rounded-xl p-2 bg-gray-50' },
                  filtA.length === 0 ? e('p', { className: 'text-center text-xs text-gray-400 py-4' }, 'No customer found.') :
                  filtA.slice(0, 8).map(c => e('button', { key: c.id, onClick: () => { setCustA(c); setStep(2); }, className: 'w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-50 text-sm' },
                    e('span', { className: 'font-medium text-gray-800' }, c.name), ' ',
                    e('span', { className: 'text-gray-400 text-xs' }, c.custCode || '', ' • ', c.phone || '')
                  ))
                )
              )
        ),

        // ── Step 2: Pick Customer B ──
        (step >= 2 || custB) && e('div', { className: 'space-y-2' },
          e('div', { className: 'flex items-center gap-2' },
            e('span', { className: 'w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center' }, '2'),
            e('label', { className: 'font-semibold text-gray-700' }, 'Select Second Customer (to merge into)')
          ),
          custB
            ? e('div', { className: 'flex items-center gap-3' },
                e(MiniCard, { c: custB, highlight: true }),
                e('button', { onClick: () => { setCustB(null); setStep(2); }, className: 'text-xs text-red-500 hover:underline whitespace-nowrap' }, 'Change')
              )
            : e('div', { className: 'space-y-2' },
                e('input', { type: 'text', value: searchB, onChange: ev => setSearchB(ev.target.value), placeholder: 'Search by Name / Mobile / Customer ID…', className: 'w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500' }),
                e('div', { className: 'max-h-40 overflow-y-auto space-y-1.5 border rounded-xl p-2 bg-gray-50' },
                  filtB.length === 0 ? e('p', { className: 'text-center text-xs text-gray-400 py-4' }, 'No customer found.') :
                  filtB.slice(0, 8).map(c => e('button', { key: c.id, onClick: () => { setCustB(c); setStep(3); }, className: 'w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-50 text-sm' },
                    e('span', { className: 'font-medium text-gray-800' }, c.name), ' ',
                    e('span', { className: 'text-gray-400 text-xs' }, c.custCode || '', ' • ', c.phone || '')
                  ))
                )
              )
        ),

        // ── Step 3: Confirm & configure ──
        custA && custB && e('div', { className: 'space-y-4' },
          e('div', { className: 'flex items-center gap-2' },
            e('span', { className: 'w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center' }, '3'),
            e('label', { className: 'font-semibold text-gray-700' }, 'Which profile to keep?')
          ),

          e('div', { className: 'grid grid-cols-2 gap-3' },
            e('button', { onClick: () => setWinner('A'), className: 'border-2 rounded-xl p-3 text-left transition ' + (winner === 'A' ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 hover:border-indigo-300') },
              e('p', { className: 'text-xs font-semibold text-indigo-600 mb-1' }, winner === 'A' ? '✓ This profile will be kept' : 'Keep this'),
              e(MiniCard, { c: custA })
            ),
            e('button', { onClick: () => setWinner('B'), className: 'border-2 rounded-xl p-3 text-left transition ' + (winner === 'B' ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 hover:border-indigo-300') },
              e('p', { className: 'text-xs font-semibold text-indigo-600 mb-1' }, winner === 'B' ? '✓ This profile will be kept' : 'Keep this'),
              e(MiniCard, { c: custB })
            )
          ),

          winnerCust && loserCust && e('div', { className: 'bg-gray-50 rounded-xl border border-gray-200 p-4 space-y-2' },
            e('p', { className: 'text-xs font-semibold text-gray-600 mb-2' }, 'Tick to copy specific fields from the other customer:'),
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-1.5' },
              ...profileFields.filter(({ key }) => loserCust[key] && loserCust[key] !== winnerCust[key]).map(({ key, label }) =>
                e('label', { key, className: 'flex items-center gap-2 text-sm cursor-pointer hover:bg-white rounded-lg p-1.5' },
                  e('input', { type: 'checkbox', checked: !!fieldOverrides[key], onChange: ev => setFieldOverrides({ ...fieldOverrides, [key]: ev.target.checked }), className: 'rounded' }),
                  e('span', { className: 'text-gray-600' }, label + ':'),
                  e('span', { className: 'text-indigo-700 font-medium truncate max-w-32' }, String(loserCust[key] || ''))
                )
              )
            ),
            profileFields.filter(({ key }) => loserCust[key] && loserCust[key] !== winnerCust[key]).length === 0 &&
              e('p', { className: 'text-xs text-gray-400 text-center py-2' }, 'All fields in both profiles are identical.')
          ),

          winnerCust && loserCust && e('div', { className: 'bg-orange-50 border border-orange-200 rounded-xl p-4 text-sm' },
            e('p', { className: 'font-semibold text-orange-800 mb-2' }, '⚠ Confirm'),
            e('ul', { className: 'text-orange-700 space-y-1 text-xs list-disc list-inside' },
              e('li', null, e('b', null, loserCust.name), '- Customer ID (', loserCust.id, ') will be deleted'),
              e('li', null, loserCust.name, '- all services & history ', e('b', null, winnerCust.name), '-will be moved under'),
              e('li', null, 'This action will be recorded in the Audit Log'),
              e('li', { className: 'text-red-600' }, 'This action cannot be undone')
            )
          )
        )
      ),

      // ── Footer ──
      e('div', { className: 'bg-gray-50 border-t px-6 py-4 flex justify-between items-center' },
        e('button', { onClick: onClose, className: 'text-gray-500 hover:text-gray-800 font-medium px-4 py-2' }, 'Cancel'),
        custA && custB
          ? e('button', { onClick: handleMerge, className: 'bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-semibold flex items-center gap-2 shadow-sm' },
              e(Icon, { name: 'GitMerge', size: 18 }), ' Merge Merge'
            )
          : e('p', { className: 'text-xs text-gray-400' }, custA ? 'Please select the second customer' : 'Please select the first customer')
      )
    )
  );
}

function CustomerCRM({ customers, setCustomers, services, tasks, setTasks, appData, persist, showMessage, currentUser, setPrintingReceipt, addAuditLog }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editingCustomerId, setEditingCustomerId] = useState(null);
  const [waCustomer, setWaCustomer] = useState(null);
  const [showWaTpl, setShowWaTpl] = useState(false);
  const [showMerge, setShowMerge] = useState(false);
  const [profileCustomer, setProfileCustomer] = useState(null);
  // Blank template for the Add/Edit Customer form. address/dob stay as plain fields for
  // backward compatibility with every existing table/search/export/receipt that reads
  // c.address and c.dob directly — the structured village/post/city/pin below are ALSO
  // kept on the customer record and are what the popup actually edits; address is the
  // auto-composed "Village, Post, City - PIN" string built from them on save.

// ── PENDING DUES ──
function PendingDues({ tasks, setTasks, customers, appData, persist, showMessage, addAuditLog }) {
  const [waCustomer, setWaCustomer] = useState(null);
  const [fromDate, setFromDate] = useState('2020-01-01');
  const [toDate, setToDate] = useState(todayStr);
  // Cash/Online choice per service row and per customer group. Defaults to Cash, so the
  // menu behaves exactly as it always did unless the operator actively picks Online.
  const [itemMode, setItemMode] = useState({});
  const [groupMode, setGroupMode] = useState({});
  const [itemUtr, setItemUtr] = useState({});
  const [itemScreenshot, setItemScreenshot] = useState({});
  const [groupUtr, setGroupUtr] = useState({});
  const [groupScreenshot, setGroupScreenshot] = useState({});
  const modeOf = (id) => itemMode[id] || 'Cash';
  const groupModeOf = (id) => groupMode[id] || 'Cash';
  // Show ALL unpaid tasks — use original entry date for filtering here
  const filteredTasks = tasks.filter(t => t.date >= fromDate && t.date <= toDate);
  const pending = groupTasks(filteredTasks).filter(g => g.totalDue > 0);

  // Single atomic write for every due clearance below. Tasks and (when the payment was
  // Online) the Savings Account Balance go out in ONE persist() call — two back-to-back
  // calls would each spread the same stale appData and the second would wipe the first.
  const commitPayment = (newTasks, onlineAdd, msg) => {
    const payload = { ...appData, tasks: newTasks };
    if (onlineAdd > 0) payload.savingsAccountBalance = (appData.savingsAccountBalance || 0) + onlineAdd;
    persist(payload);
    showMessage(msg + (onlineAdd > 0 ? ' — ₹' + onlineAdd + ' added to Savings Account Balance' : ''));
  };

  const markGroupSuccessful = (groupId, mode, utr, screenshot) => {
    const m = mode || 'Cash';
    if (m === 'Online' && !(utr||'').trim()) return showMessage('Online payment-UTR Number is required for this payment.', 'error');
    if (m === 'Online' && !(screenshot||'').trim()) return showMessage('Online payment-Screenshot File Name is required for this payment.', 'error');
    let onlineAdd = 0;
    const newTasks = tasks.map(t => {
      if ((t.groupId !== undefined ? t.groupId : t.id) !== groupId) return t;
      const remaining = Math.max(0, (t.price || 0) - (t.paidAmount || 0));
      if (remaining <= 0) return t;
      if (m === 'Online') onlineAdd += remaining;
      const hist = [...(t.paymentHistory || []), { date: todayStr, amount: remaining, mode: m }];
      return { ...t, status: 'Successful', paidAmount: t.price, paymentDate: todayStr, paymentHistory: hist, ...(m === 'Online' ? { utrNumber: (utr||'').trim(), screenshotFileName: (screenshot||'').trim() } : {}) };
    });
    commitPayment(newTasks, onlineAdd, 'Marked as Successful (' + m + ')! Payment date: ' + todayStr);
  };
  const markItemSuccessful = (id, mode, utr, screenshot) => {
    const m = mode || 'Cash';
    if (m === 'Online' && !(utr||'').trim()) return showMessage('Online payment-UTR Number is required for this payment.', 'error');
    if (m === 'Online' && !(screenshot||'').trim()) return showMessage('Online payment-Screenshot File Name is required for this payment.', 'error');
    let onlineAdd = 0;
    const newTasks = tasks.map(t => {
      if (t.id !== id) return t;
      const remaining = Math.max(0, (t.price || 0) - (t.paidAmount || 0));
      if (remaining <= 0) return t;
      if (m === 'Online') onlineAdd += remaining;
      const hist = [...(t.paymentHistory || []), { date: todayStr, amount: remaining, mode: m }];
      return { ...t, status: 'Successful', paidAmount: t.price, paymentDate: todayStr, paymentHistory: hist, ...(m === 'Online' ? { utrNumber: (utr||'').trim(), screenshotFileName: (screenshot||'').trim() } : {}) };
    });
    commitPayment(newTasks, onlineAdd, 'Marked as Successful (' + m + ')! Payment date: ' + todayStr);
  };
  const setItemStatus = (id, status) => { setTasks(tasks.map(t => t.id === id ? { ...t, status } : t)); showMessage('Status updated'); };

  // Partial payment recording
  const recordPartialPayment = (id, amt, mode, utr, screenshot) => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const m = mode || 'Cash';
    if (m === 'Online' && !(utr||'').trim()) return showMessage('Online payment-UTR Number is required for this payment.', 'error');
    if (m === 'Online' && !(screenshot||'').trim()) return showMessage('Online payment-Screenshot File Name is required for this payment.', 'error');
    const newPaid = Math.min(t.price || 0, (t.paidAmount || 0) + amt);
    const applied = newPaid - (t.paidAmount || 0);
    if (applied <= 0) return;
    const done = newPaid >= (t.price || 0);
    const hist = [...(t.paymentHistory || []), { date: todayStr, amount: applied, mode: m }];
    const newTasks = tasks.map(x =>
      x.id === id
        ? { ...x, paidAmount: newPaid, status: done ? 'Successful' : x.status, paymentDate: todayStr, paymentHistory: hist, ...(m === 'Online' ? { utrNumber: (utr||'').trim(), screenshotFileName: (screenshot||'').trim() } : {}) }
        : x
    );
    commitPayment(
      newTasks,
      m === 'Online' ? applied : 0,
      done ? 'Fully paid (' + m + ')! Payment date: ' + todayStr
           : '₹' + applied + ' recorded (' + m + '). Remaining: ₹' + ((t.price||0) - newPaid)
    );
  };

  const getCustomer = (id, name) => (id !== undefined && id !== null && customers.find(c => c.id === id)) || customers.find(c => c.name === name);

  const totalDue = pending.reduce((s, g) => s + g.totalDue, 0);

  return e('div', { className: 'space-y-4' },
    e('div', { className: 'flex justify-between items-center' },
      e('div', null, e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Pending Amount'), e('p', { className: 'text-sm text-gray-500' }, 'All pending payments are listed here')),
      e('div', { className: 'bg-red-50 border border-red-200 rounded-xl px-5 py-3 text-center' },
        e('p', { className: 'text-xs text-red-500 font-medium' }, 'Total Due'),
        e('p', { className: 'text-2xl font-bold text-red-600' }, `₹${totalDue}`)
      )
    ),
    e(ExportBar, { fromDate, setFromDate, toDate, setToDate, onExport: () => {
      const rows = pending.map(g => {
        const c = getCustomer(g.customerId, g.customerName);
        return { 'Customer ID': c?.custCode || '', Customer: g.customerName, Mobile: c?.phone || '', Address: c?.address || '', DOB: c?.dob || '', Services: g.items.map(i => i.service).join(', '), 'Total Amount': g.totalAmount, 'Amount Paid': g.totalPaid, 'Due Amount': g.totalDue, Date: g.date, Status: g.status };
      });
      exportToExcel(rows, `PendingDues_${fromDate}_to_${toDate}`);

function BankingLedger({ bankTransactions, setBankTransactions, tasks, openingBalances, setOpeningBalances, setOpeningBalanceFor, archiveBankTransactions, addMoreHistory, setAddMoreHistory, addMoreBalance, onlineTransactions, accountBalanceExpenses, setAccountBalanceExpenses, accountBalanceOverrides, setAccountBalanceOverrides, accountBalanceArchivedOffset, setAccountBalanceArchivedOffset, setAccountBalancePermanent, savingsAccountBalance, setSavingsAccountBalance, cscWalletBase, setCscWalletBase, cscWalletTopups, setCscWalletTopups, cscWalletExpenses, setCscWalletExpenses, savingsExpenses, setSavingsExpenses, currentUser, showMessage, businessProfile }) {
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [form, setForm] = useState({ customerName: '', cashIn: '', cashOut: '', location: 'Bank', selfTransferType: 'deposit' });
  const [editingBase, setEditingBase] = useState(false);
  const [baseInput, setBaseInput] = useState(String(openingBalances[todayStr] || 0));
  const [showArchive, setShowArchive] = useState(false);
  const [archFrom, setArchFrom] = useState('');
  const [archTo, setArchTo] = useState('');
  const [showSetAccBal, setShowSetAccBal] = useState(false);
  const [accBalInput, setAccBalInput] = useState('');
  const [showSetSavings, setShowSetSavings] = useState(false);
  const [savingsInput, setSavingsInput] = useState('');
  const [showSetCscWallet, setShowSetCscWallet] = useState(false);
  const [cscWalletInput, setCscWalletInput] = useState('');
  const [showTopup, setShowTopup] = useState(false);
  const [topupInput, setTopupInput] = useState('');
  const [showAddMore, setShowAddMore] = useState(false);
  const [addMoreInput, setAddMoreInput] = useState('');
  const [bankingTab, setBankingTab] = useState('ledger');
  const [expForm, setExpForm] = useState({ name: '', cost: '', date: todayStr, remarks: '' }); // 'ledger' | 'reports'
  const [cscExpForm, setCscExpForm] = useState({ name: '', cost: '', date: todayStr, remarks: '' });
  const [savingsExpForm, setSavingsExpForm] = useState({ name: '', cost: '', date: todayStr, remarks: '' });

  // ── Reports tab state ──
  const [rptFrom, setRptFrom] = useState(todayStr);
  const [rptTo,   setRptTo]   = useState(todayStr);

  const todays = bankTransactions.filter(t => t.date === selectedDate).sort((a, b) => a.id - b.id);
  // Opening Balance is exactly what was manually typed in for this date — nothing else is added to it.
  const openingBalance = openingBalances[selectedDate] || 0;

  // Online transactions for selected date
  const safeOnline = Array.isArray(onlineTransactions) ? onlineTransactions : [];
  const onlineTodays = safeOnline.filter(t => t.date === selectedDate);
  const onlineReceivedToday  = onlineTodays.filter(t => t.type === 'received').reduce((s, t) => s + (t.amount || 0), 0);
  const onlineTransferToday  = onlineTodays.filter(t => t.type === 'transfer').reduce((s, t) => s + (t.amount || 0), 0);

  // Banking transactions for selected date
  const bankDeposit    = todays.reduce((s, t) => s + (t.cashIn  || 0), 0);
  const bankWithdrawal = todays.reduce((s, t) => s + (t.cashOut || 0), 0);

  // Combined: Online Received adds to Withdrawal side, Online Transfer adds to Deposit side
  const totalDeposit    = bankDeposit    + onlineTransferToday;
  const totalWithdrawal = bankWithdrawal + onlineReceivedToday;
  const currentBalance  = openingBalance + totalDeposit - totalWithdrawal;

  let running = openingBalance;
  const rows = todays.map(t => { running += (t.cashIn || 0) - (t.cashOut || 0); return { ...t, runningBalance: running }; });

  // ── Account Balance (all-time) ──
  const allTxns = bankTransactions;
  // Online Transactions entered from now on carry toSavings:true and are redirected to the
  // Savings Account Balance (Received +, Transfer -), computed live from this array so adding
  // or deleting an entry keeps Savings correct automatically. Older entries (no flag) keep
  // affecting Account Balance exactly as before, so no existing balance silently shifts.
  const legacyOnline = safeOnline.filter(t => !t.toSavings);
  const savingsOnline = safeOnline.filter(t => t.toSavings);
  const allOnlineReceived = legacyOnline.filter(t => t.type === 'received').reduce((s, t) => s + (Number(t.amount) || 0), 0);
  const allOnlineTransfer = legacyOnline.filter(t => t.type === 'transfer').reduce((s, t) => s + (Number(t.amount) || 0), 0);
  const savingsOnlineReceived = savingsOnline.filter(t => t.type === 'received').reduce((s, t) => s + (Number(t.amount) || 0), 0);
  const savingsOnlineTransfer = savingsOnline.filter(t => t.type === 'transfer').reduce((s, t) => s + (Number(t.amount) || 0), 0);
  // Digipay Withdrawals are redirected to Savings Account Balance instead of Account Balance —
  // so they're excluded here and added to savingsBalance below instead. Everything else
  // (Bank Withdrawal/Deposit, Digipay Deposit, Cash ledger, Reports) is unchanged.
  const digipayWithdrawalTotal = allTxns.filter(t => t.location === 'Digipay').reduce((s, t) => s + (t.cashOut || 0), 0);
  const allTimeWithdrawal = allTxns.reduce((s, t) => s + ((t.location === 'Digipay') ? 0 : (t.cashOut || 0)), 0) + allOnlineReceived;
  const allTimeDeposit    = allTxns.reduce((s, t) => s + (t.cashIn  || 0), 0) + allOnlineTransfer;
  const allTimeAddMore    = Object.values((addMoreHistory && typeof addMoreHistory === 'object') ? addMoreHistory : {}).flat().filter(x => typeof x === 'number').reduce((s, a) => s + (Number(a) || 0), 0);
  const allAccExpenses    = (accountBalanceExpenses || []).reduce((s, x) => s + (x.cost || 0), 0);
  const safeArchivedOffset = Number(accountBalanceArchivedOffset) || 0;
  // Withdrawal entries ADD to Account Balance, Deposit entries SUBTRACT — this always runs
  // automatically off live bankTransactions plus whatever was folded in from archived history,
  // so it stays correct on every new Cash IN / Cash OUT entry without needing a manual override.
  // Self Transfer calculations
  const allTxns_raw = Array.isArray(bankTransactions) ? bankTransactions : [];
  const selfDeposits   = allTxns_raw.filter(t => t.location === 'Self Transfer' && t.selfTransferType === 'deposit');
  const selfWithdrawals= allTxns_raw.filter(t => t.location === 'Self Transfer' && t.selfTransferType === 'withdrawal');
  const selfDepTotal   = selfDeposits.reduce((s, t) => s + (t.selfTransferAmount || 0), 0);
  const selfWithTotal  = selfWithdrawals.reduce((s, t) => s + (t.selfTransferAmount || 0), 0);

  // ── CSC Digital Seva Wallet + Savings Expense ──
  // CSC Wallet is topped up FROM Savings (cscTopupTotal reduces Savings, increases the Wallet —
  // symmetric, both computed from the SAME cscWalletTopups array so they can never drift apart).
  // It is spent on: (a) manual wallet expenses, and (b) every service's Portal Cost, read LIVE
  // straight off `tasks` — so if a service is ever edited or deleted anywhere in the app (CRM,

// ── DAILY CASH CLOSING REPORT ──
// Read-only combined view: pulls numbers from tasks (service collection), bankTransactions
// (CSP deposit/withdraw) and expenses — does NOT write to any of those lists, so the
// Service Tracking / Pending Amount / Banking / Expenses menus are completely unaffected.
// Only writes to its own new field: cashClosingLogs.
// ── SSS REPORTS (PMSBY / PMJJBY / New Account / APY enrolment log) ──
// Fully standalone: reads/writes only appData.sssEntries. Nothing else in the app reads this
// field, and this component reads nothing from tasks/customers/expenses/banking — so it can
// never mix with or affect any other menu's numbers.
const SSS_SCHEMES = [
  { key: 'pmsby',      label: 'PMSBY',       full: 'Pradhan Mantri Suraksha Bima Yojana',     color: 'blue',   refLabel: 'Policy No' },
  { key: 'pmjjby',     label: 'PMJJBY',      full: 'Pradhan Mantri Jeevan Jyoti Bima Yojana',  color: 'purple', refLabel: 'Policy No' },
  { key: 'newAccount', label: 'New Account', full: 'New Bank Account Opened',                  color: 'green',  refLabel: 'Account No' },
  { key: 'apy',        label: 'APY',         full: 'Atal Pension Yojana',                       color: 'orange', refLabel: 'Account No' },
];
const SSS_COLOR = { blue: ['bg-blue-50','text-blue-600'], purple: ['bg-purple-50','text-purple-600'], green: ['bg-green-50','text-green-600'], orange: ['bg-orange-50','text-orange-600'] };
const sssScheme = (key) => SSS_SCHEMES.find(s => s.key === key) || SSS_SCHEMES[0];

function SSSReports({ appData, persist, currentUser, showMessage }) {
  const sssEntries = Array.isArray(appData.sssEntries) ? appData.sssEntries : [];
  const isAdmin = currentUser.role === 'admin';

  const blankForm = { date: todayStr, scheme: 'pmsby', customerName: '', refNo: '', note: '' };
  const [form, setForm] = useState(blankForm);
  const [view, setView] = useState('entries'); // 'entries' | 'datewise' | 'monthly'
  const [fromDate, setFromDate] = useState(curMonth + '-01');
  const [toDate, setToDate] = useState(todayStr);
  const [search, setSearch] = useState('');

  const handleAdd = () => {
    if (!form.customerName.trim()) return showMessage('Please enter the customer name.', 'error');
    if (!form.date) return showMessage('Please pick a date.', 'error');
    const entry = {
      id: Date.now(), date: form.date, scheme: form.scheme,
      customerName: form.customerName.trim(), refNo: form.refNo.trim(), note: form.note,
      staffId: currentUser.id, staffName: currentUser.name
    };
    persist({ ...appData, sssEntries: [...sssEntries, entry] });
    setForm({ ...blankForm, date: form.date, scheme: form.scheme });
    showMessage(sssScheme(form.scheme).label + ' entry saved for ' + entry.customerName + '!');
  };

  const deleteEntry = (id) => {
    persist({ ...appData, sssEntries: sssEntries.filter(x => x.id !== id) });
    showMessage('Entry deleted', 'error');
  };

  const inRange = sssEntries.filter(x => x.date >= fromDate && x.date <= toDate);
  const countsOf = (list) => SSS_SCHEMES.reduce((acc, s) => { acc[s.key] = list.filter(x => x.scheme === s.key).length; return acc; }, {});
  const rangeCounts = countsOf(inRange);
  const grandTotal = inRange.length;

  const searchQ = search.trim().toLowerCase();
  const searchedEntries = inRange
    .filter(x => !searchQ || [x.customerName, x.refNo, x.staffName].some(v => (v || '').toLowerCase().includes(searchQ)))
    .slice().sort((a, b) => (b.date + b.id) < (a.date + a.id) ? -1 : 1);

  // Date-wise breakdown (within range)
  const dateMap = {};
  inRange.forEach(x => { if (!dateMap[x.date]) dateMap[x.date] = []; dateMap[x.date].push(x); });

function DailyCashClosing({ tasks, expenses, bankTransactions, bankingOpeningBalances, cashClosingLogs, setCashClosingLogs, onlineTransactions, customers, currentUser, showMessage, businessProfile }) {
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [actualInput, setActualInput] = useState('');
  const [noteInput, setNoteInput] = useState('');
  const [histFrom, setHistFrom] = useState(curMonth + '-01');
  const [histTo, setHistTo] = useState(todayStr);

  const todaysTasks = tasks.filter(t => t.date === selectedDate);
  const todaysExpenses = expenses.filter(x => x.date === selectedDate);
  const todaysBankTxns = bankTransactions.filter(t => t.date === selectedDate);
  // "New" now means the customer's PROFILE was first created on this date (their id is a
  // creation timestamp) — not merely that they visited today. A returning customer's Customer
  // ID stays the same, so they no longer count as "new" just for coming back.
  const todaysNewCustomers = (customers || []).filter(c => {
    const created = c.id ? new Date(c.id).toISOString().split('T')[0] : c.lastVisit;
    return created === selectedDate;
  });

  // 1) Total Income — same paymentHistory-aware definition as the Dashboard's "Total Income" card,
  //    for this single day. This is the fix: a Pending due cleared later (via Pending Amount) is
  //    recorded as a paymentHistory entry dated the day it was actually paid — NOT the task's
  //    original entry date — so it must be counted here by THAT date, or a same-day full clearance
  //    on a task entered on an earlier day would never show up in any day's Cash Closing at all.
  const getInitialPaid = (t) => {
    const laterPayments = (t.paymentHistory || []).reduce((s, p) => s + p.amount, 0);
    return Math.max(0, (t.paidAmount || 0) - laterPayments) - (t.portalCost || 0);
  };
  const entryIncomeToday = todaysTasks.reduce((s, t) => s + getInitialPaid(t), 0);
  const historyIncomeToday = tasks.reduce((s, t) => {
    const histToday = (t.paymentHistory || []).filter(p => p.date === selectedDate).reduce((hs, p) => hs + p.amount, 0);
    return s + histToday;
  }, 0);
  const totalIncome = entryIncomeToday + historyIncomeToday;
  // 2) Total Expense — same as the Expenses menu, for this single day.
  const expenseTotal = todaysExpenses.reduce((s, x) => s + x.cost, 0);
  // 3) Net Profit — exactly the Dashboard's "Net Profit" card formula, for this single day.
  //    (Portal-cost-adjusted, unchanged — this stays the "true business profit" figure.)
  const netProfit = totalIncome - expenseTotal;
  // 3b) Cash-in-hand version, used ONLY for Expected Closing Cash below — NOT for the Net Profit
  //     stat card or PDF, which keep using netProfit above exactly as before.
  //     Two corrections vs. totalIncome:
  //       - Online-mode payments never touch the physical cash drawer (that money goes straight
  //         to Savings Account Balance instead — see CustomerCRM), so they're excluded here.
  //       - Portal Cost is paid out of the CSC Wallet, not the cash drawer, so Cash-mode payments
  //         are counted at their FULL amount here (not portal-cost-reduced like getInitialPaid).
  //     Later due clearances (Pending Amount menu) now carry their own Cash/Online mode, so the
  //     Online ones are excluded here exactly like entry-time Online payments — that money went
  //     to Savings Account Balance, not into the drawer. Entries saved before the Pending Amount
  //     menu had a mode selector have no `mode` field and still count as cash, as they always did.
  const getInitialPaidCash = (t) => {
    const laterPayments = (t.paymentHistory || []).reduce((s, p) => s + p.amount, 0);
    return Math.max(0, (t.paidAmount || 0) - laterPayments);
  };
  const cashEntryIncomeToday = todaysTasks
    .filter(t => (t.paymentMode || 'Cash') !== 'Online')
    .reduce((s, t) => s + getInitialPaidCash(t), 0);
  const cashHistoryIncomeToday = tasks.reduce((s, t) => {
    const histToday = (t.paymentHistory || [])
      .filter(p => p.date === selectedDate && (p.mode || 'Cash') !== 'Online')
      .reduce((hs, p) => hs + p.amount, 0);
    return s + histToday;
  }, 0);
  const cashIncomeToday = cashEntryIncomeToday + cashHistoryIncomeToday;
  const cashProfitToday = cashIncomeToday - expenseTotal;
  // 4) Banking Current Balance — Banking Ledger's "Current Balance" for this date
  //    includes online transactions (received → withdrawal side, transfer → deposit side)
  const safeOnlineTxns = Array.isArray(onlineTransactions) ? onlineTransactions : [];
  const todaysOnline = safeOnlineTxns.filter(t => t.date === selectedDate);
  const onlineReceivedToday = todaysOnline.filter(t => t.type === 'received').reduce((s, t) => s + (t.amount || 0), 0);
  const onlineTransferToday = todaysOnline.filter(t => t.type === 'transfer').reduce((s, t) => s + (t.amount || 0), 0);
  const bankDeposit = todaysBankTxns.reduce((s, t) => s + (t.cashIn || 0), 0) + onlineTransferToday;
  const bankWithdraw = todaysBankTxns.reduce((s, t) => s + (t.cashOut || 0), 0) + onlineReceivedToday;
  const bankingOpening = bankingOpeningBalances[selectedDate] || 0;
  const bankingCurrentBalance = bankingOpening + bankDeposit - bankWithdraw;

  // Expected Closing Cash:
  // If Banking Current Balance is negative → Expected Closing Cash = Banking Current Balance (same value)
  // If Banking Current Balance is zero or positive → Cash Profit (Cash-mode only, full amount) + Banking Current Balance
  const expectedClosing = bankingCurrentBalance < 0 ? bankingCurrentBalance : cashProfitToday + bankingCurrentBalance;

  // Reference-only figures — shown for a full picture of the day, but NOT part of the cash formula above.
  const pendingGroups = groupTasks(tasks.filter(t => t.date <= selectedDate)).filter(g => g.totalDue > 0);
  const pendingAmount = pendingGroups.reduce((s, g) => s + g.totalDue, 0);
  const todaysServiceGroups = groupTasks(todaysTasks);
  const pendingTasksCount = todaysTasks.filter(t => t.status === 'Pending').length;
  const processingTasksCount = todaysTasks.filter(t => t.status === 'Processing').length;
  const successfulTasksCount = todaysTasks.filter(t => t.status === 'Successful').length;

  let bankRunning = bankingOpening;
  const bankRows = todaysBankTxns.slice().sort((a, b) => a.id - b.id).map(t => { bankRunning += (t.cashIn || 0) - (t.cashOut || 0); return { ...t, runningBalance: bankRunning }; });

  const savedLog = cashClosingLogs.find(l => l.date === selectedDate);

  useEffect(() => {
    setActualInput(savedLog ? String(savedLog.actualCash) : '');
    setNoteInput(savedLog ? (savedLog.note || '') : '');
  }, [selectedDate]);

  const saveClosing = () => {
    if (actualInput === '') return showMessage('Please enter the actual cash count.', 'error');
    const actualCash = Number(actualInput) || 0;
    const entry = {
      id: savedLog ? savedLog.id : Date.now(), date: selectedDate,
      totalIncome, expenseTotal, netProfit, cashProfitToday, bankingCurrentBalance, bankingOpeningBalance: bankingOpening, pendingAmount,
      expectedClosing, actualCash, difference: actualCash - expectedClosing,
      note: noteInput, closedBy: currentUser.name,
      serviceGroups: todaysServiceGroups,
      todaysExpenses: todaysExpenses,
      bankRows: bankRows,
      dayOverview: {
        customersServed: todaysServiceGroups.length,
        newCustomers: todaysNewCustomers.length,
        pendingTasks: pendingTasksCount,
        processingTasks: processingTasksCount,
        successfulTasks: successfulTasksCount,
        bankTxns: todaysBankTxns.length,
        pendingAmount
      }
    };
    const updated = savedLog ? cashClosingLogs.map(l => l.id === entry.id ? entry : l) : [...cashClosingLogs, entry];
    setCashClosingLogs(updated);
    showMessage(savedLog ? 'Closing updated!' : 'Daily cash closing saved!');
  };

  const exportReport = () => {
    const isAdmin = currentUser.role === 'admin';
    const aoa = [
      [null, businessProfile.name + ' — DAILY CASH CLOSING REPORT'],
      [null, 'Date: ' + selectedDate],
      [],
      ...(isAdmin ? [['Total Income (all modes)', totalIncome]] : []),
      ['(-) Total Expense', expenseTotal],
      ...(isAdmin ? [['= Net Profit (business, reference only)', netProfit]] : []),
      ['Cash Profit (Cash-mode only, after Expense)', cashProfitToday],
      ['(+) Banking Current Balance', bankingCurrentBalance],
      ['= Expected Closing Cash', expectedClosing],
      ['Actual Cash Counted', actualInput === '' ? '' : Number(actualInput)],
      ['Difference (Actual - Expected)', actualInput === '' ? '' : (Number(actualInput) - expectedClosing)],
      [],
      ['Day Overview —'],
      ['Customers Served', todaysServiceGroups.length],
      ['New Customers Added', todaysNewCustomers.length],
      ['Pending Tasks', pendingTasksCount],
      ['Processing Tasks', processingTasksCount],
      ['Successful Tasks', successfulTasksCount],
      ['Banking Transactions', todaysBankTxns.length],
      [],
      ['Service Collections —', 'Customer', 'Service(s)', 'Total', 'Paid', 'Due', 'Status'],
      ...todaysServiceGroups.map(g => [null, g.customerName, g.items.map(i => i.service).join(', '), g.totalAmount, g.totalPaid, g.totalDue, g.status]),
      [],
      ['Banking Transactions —', 'Customer/Details', 'Cash IN', 'Cash OUT', 'Location', 'Running Balance'],
      ...bankRows.map(t => [null, t.customerName, t.cashIn || '', t.cashOut || '', t.location || 'Bank', t.runningBalance]),
      [],
      ['Expenses —', 'Name', 'Remarks', 'Cost', 'Added By'],
      ...todaysExpenses.map(x => [null, x.name, x.remarks || '', x.cost, x.staffName || '']),
      [],
      ['New Customers Added —', 'Name', 'Phone', 'Address', 'Service'],
      ...todaysNewCustomers.map(c => [null, c.name, c.phone || '', c.address || '', c.service || '']),
      [],
      ['Outstanding Pending Dues (reference only, not in cash formula) —', 'Customer', 'Service(s)', 'Due'],
      ...pendingGroups.map(g => [null, g.customerName, g.items.map(i => i.service).join(', '), g.totalDue])
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Cash Closing');
    XLSX.writeFile(wb, `Daily_Cash_Closing_${selectedDate}.xlsx`);
  };

  const histLogs = cashClosingLogs.filter(l => l.date >= histFrom && l.date <= histTo).slice().sort((a, b) => a.date < b.date ? 1 : -1);

  const diff = actualInput === '' ? null : (Number(actualInput) || 0) - expectedClosing;

  const sectionHeader = (icon, title) => e('h5', { className: 'font-bold text-gray-700 text-sm mb-3 flex items-center gap-2' }, e(Icon, { name: icon, size: 15 }), ` ${title}`);
  const emptyNote = (text) => e('p', { className: 'text-xs text-gray-400' }, text);

  return e('div', { className: 'space-y-4' },
    e('div', { className: 'flex flex-wrap justify-between items-center gap-3' },
      e('div', null, e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Daily Cash Closing Report'), e('p', { className: 'text-sm text-gray-500' }, 'Cash Profit (Cash-mode only) + Banking Current Balance = Expected Closing Cash')),
      e('div', { className: 'flex items-end gap-3' },
        e('div', null, e('label', { className: 'text-xs text-gray-500 block mb-1' }, 'Date'), e('input', { type: 'date', value: selectedDate, onChange: ev => setSelectedDate(ev.target.value), className: 'border rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-indigo-500' })),
        e('button', { onClick: exportReport, className: 'flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm' }, e(Icon, { name: 'Download', size: 16 }), ' Export Excel')
      )
    ),

    e('div', { className: 'grid grid-cols-2 md:grid-cols-6 gap-4' },
      currentUser.role === 'admin' && e(StatCard, { title: 'Total Income', value: `₹${totalIncome}`, icon: e(Icon, { name: 'TrendingUp', size: 22 }), color: 'bg-green-50 text-green-600' }),
      e(StatCard, { title: 'Total Expense', value: `₹${expenseTotal}`, icon: e(Icon, { name: 'TrendingDown', size: 22 }), color: 'bg-red-50 text-red-500' }),
      currentUser.role === 'admin' && e(StatCard, { title: 'Net Profit', value: fmtR(netProfit), icon: e(Icon, { name: 'DollarSign', size: 22 }), color: netProfit >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600' }),

// ── REPORTS ──
function ReportsInvoices({ tasks, setTasks, customers, setCustomers, appData, persist, businessProfile, setPrintingReceipt, currentUser }) {
  const [fromDate, setFromDate] = useState(todayStr);
  const [toDate, setToDate] = useState(todayStr);
  // Tasks appear on entry date OR if any paymentHistory entry falls in range
  const taskInRange = (t) => {
    if (t.date >= fromDate && t.date <= toDate) return true;
    return (t.paymentHistory || []).some(p => p.date >= fromDate && p.date <= toDate);
  };
  const filteredTasks = tasks.filter(taskInRange);
  const groups = groupTasks(filteredTasks);

  const totalInvoiced = groups.reduce((s, g) => s + g.totalAmount, 0);
  const totalCollected = groups.reduce((s, g) => s + g.totalPaid, 0);
  const totalDue = groups.reduce((s, g) => s + g.totalDue, 0);

    e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Reports & Invoices'),

// ── STAFF SALARY MANAGEMENT ──
function generateSalarySlipPDF(u, selMonth, info, bp) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pw = doc.internal.pageSize.getWidth();
  const [yr, mo] = selMonth.split('-').map(Number);
  const monthLabel = new Date(yr, mo - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

  // ── Header ──
  doc.setFillColor(67, 56, 202);
  doc.rect(0, 0, pw, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16); doc.setFont(undefined, 'bold');
  doc.text((bp && bp.name) || 'CSC Center', pw / 2, 10, { align: 'center' });
  doc.setFontSize(7.5); doc.setFont(undefined, 'normal');
  doc.text([(bp && bp.address) || '', 'CSC ID: ' + ((bp && bp.cscId) || '') + '   |   ' + ((bp && bp.phone) || '')].join('   '), pw / 2, 17, { align: 'center' });
  doc.setFontSize(12); doc.setFont(undefined, 'bold');
  doc.text('SALARY SLIP', pw / 2, 24, { align: 'center' });

  doc.setTextColor(30, 30, 30);
  let y = 34;

  // Month banner
  doc.setFillColor(238, 242, 255);
  doc.roundedRect(10, y, pw - 20, 10, 2, 2, 'F');
  doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.setTextColor(67, 56, 202);
  doc.text('Month: ' + monthLabel, pw / 2, y + 6.5, { align: 'center' });
  y += 14;

  // Staff details
  doc.setTextColor(30, 30, 30);
  doc.setFontSize(9.5); doc.setFont(undefined, 'bold');
  doc.text('Staff Details', 12, y); y += 5;
  doc.setDrawColor(200, 200, 220); doc.line(12, y, pw - 12, y); y += 4;
  doc.setFont(undefined, 'normal'); doc.setFontSize(9);
  doc.text('Name:', 12, y); doc.setFont(undefined, 'bold'); doc.text(u.name || '', 45, y);
  doc.setFont(undefined, 'normal'); doc.text('Role:', pw / 2, y); doc.setFont(undefined, 'bold'); doc.text((u.role || '').toUpperCase(), pw / 2 + 18, y);
  y += 7; doc.setFont(undefined, 'normal');
  doc.text('User ID:', 12, y); doc.setFont(undefined, 'bold'); doc.text(String(u.id || ''), 45, y);
  y += 8;

  // Attendance
  doc.setFontSize(9.5); doc.setFont(undefined, 'bold');
  doc.text('Attendance', 12, y); y += 5;
  doc.line(12, y, pw - 12, y); y += 4;
  doc.setFontSize(9); doc.setFont(undefined, 'normal');
  const daysInM = new Date(yr, mo, 0).getDate();
  const rows1 = [
    ['Days in Month', String(daysInM)],
    ['Days Present', String(info.daysWorked)],
    ['Days Absent', String(daysInM - info.daysWorked)],
  ];
  rows1.forEach(([label, val]) => {
    doc.text(label + ':', 14, y); doc.setFont(undefined, 'bold'); doc.text(val, 70, y); doc.setFont(undefined, 'normal'); y += 6;
  });
  y += 2;

  // Salary Calculation table
  doc.setFontSize(9.5); doc.setFont(undefined, 'bold');
  doc.text('Salary Calculation', 12, y); y += 5;
  doc.line(12, y, pw - 12, y); y += 2;

  doc.autoTable({
    startY: y,
    margin: { left: 12, right: 12 },
    theme: 'grid',
    headStyles: { fillColor: [67, 56, 202], textColor: 255, fontSize: 9, fontStyle: 'bold', cellPadding: 3 },
    bodyStyles: { fontSize: 9, cellPadding: 3 },
    alternateRowStyles: { fillColor: [245, 245, 255] },
    head: [['Description', 'Details', 'Amount']],
    body: [
      ['Daily Rate',         String(info.daysWorked) + ' days × ₹' + info.rate + '/day', '₹' + info.grossSalary],
      ['Advance Deduction',  'Total advance this month',    info.totalAdvMonth > 0 ? '-₹' + info.totalAdvMonth : '—'],
      ['Net Salary',         'Gross - Advance',              '₹' + info.netSalary],
      ['Amount Paid',        'Salary paid this month',       '₹' + info.totalPaidMonth],
      ['Balance Due',        info.balanceDue > 0 ? 'Remaining to be paid' : 'Fully paid', info.balanceDue > 0 ? '₹' + info.balanceDue : '✓ Paid'],
    ],
    didParseCell: function (data) {
      if (data.row.index === 2) data.cell.styles.fontStyle = 'bold';
      if (data.row.index === 4) {
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.textColor = info.balanceDue > 0 ? [220, 38, 38] : [22, 163, 74];
      }
    }
  });
  y = doc.lastAutoTable.finalY + 8;

  // Note
  doc.setFontSize(7.5); doc.setFont(undefined, 'italic'); doc.setTextColor(120, 120, 120);
