<script>
const { useState, useEffect, useCallback } = React;
const e = React.createElement;
const todayStr = new Date().toISOString().split('T')[0];
const curMonth = todayStr.slice(0, 7);

// Formats a rupee amount so negative values read as "-₹1234" (not "₹-1234").
function fmtR(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-₹' : '₹') + Math.abs(v);
}
// Same, but also prefixes a "+" for positive values (used for "Difference" style figures).
function fmtRSigned(n) {
  const v = Number(n) || 0;
  if (v > 0) return '+₹' + v;
  if (v < 0) return '-₹' + Math.abs(v);
  return '₹0';
}

function exportToExcel(data, filename) {
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename + '.xlsx');
}

// ── PDF GENERATION (single page, compact) ──
function generateCashClosingPDF(data, businessProfile, isAdmin) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pw = doc.internal.pageSize.getWidth();
  const ph = doc.internal.pageSize.getHeight(); // 297mm
  let y = 0;

  // ── Header bar ──
  doc.setFillColor(67, 56, 202);
  doc.rect(0, 0, pw, 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text(businessProfile.name, pw/2, 9, { align: 'center' });
  doc.setFontSize(7); doc.setFont(undefined,'normal');
  doc.text(businessProfile.address + '  |  Ph: ' + businessProfile.phone + '  |  ' + businessProfile.cscId, pw/2, 14, { align: 'center' });
  doc.text('DAILY CASH CLOSING REPORT  —  ' + data.date, pw/2, 19, { align: 'center' });
  y = 25;

  // ── Summary + Day Overview side by side ──
  // Left: Summary (col 10..105), Right: Day overview (col 108..200)
  const leftX = 10, midX = 105, rightX = 108, rightW = pw - rightX - 5;

  doc.setFillColor(238,242,255);
  doc.roundedRect(leftX, y, midX - leftX, 60, 2, 2, 'F');
  doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
  doc.text('Cash Reconciliation', leftX + (midX-leftX)/2, y+5, { align: 'center' });

  const sumRows = [
    ...(isAdmin ? [['Total Income', fmtR(data.totalIncome), false]] : []),
    ['(-) Total Expense', fmtR(data.expenseTotal), false],
    ...(isAdmin ? [['= Net Profit', fmtR(data.netProfit), true]] : []),
    ['(+) Banking Balance', fmtR(data.bankingCurrentBalance), false],
    ['= Expected Closing', fmtR(data.expectedClosing), true],
    ['Actual Cash Counted', fmtR(data.actualCash), true],
    ['Difference', fmtRSigned(data.difference), true],
  ];
  doc.setFontSize(7);
  sumRows.forEach((r, i) => {
    const ry = y + 10 + i * 7.2;
    if (i % 2 === 0) { doc.setFillColor(230,235,255); doc.rect(leftX+1, ry-3.5, midX-leftX-2, 7, 'F'); }
    doc.setFont(undefined, r[2] ? 'bold' : 'normal');
    const diffCol = r[0] === 'Difference' ? (data.difference < 0 ? [220,38,38] : data.difference > 0 ? [37,99,235] : [22,163,74]) : [30,30,30];
    doc.setTextColor(...diffCol);
    doc.text(r[0], leftX+3, ry);
    doc.text(r[1], midX-3, ry, { align: 'right' });
  });

  // Right: Day Overview
  if (data.dayOverview) {
    doc.setFillColor(240,253,244);
    doc.roundedRect(rightX, y, rightW, 60, 2, 2, 'F');
    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(22,163,74);
    doc.text('Day Overview', rightX + rightW/2, y+5, { align: 'center' });
    const ov = data.dayOverview;
    const ovRows = [
      ['Customers Served', ov.customersServed],
      ['New Customers', ov.newCustomers],
      ['Successful Tasks', ov.successfulTasks],
      ['Pending Tasks', ov.pendingTasks],
      ['Processing Tasks', ov.processingTasks],
      ['Banking Txns', ov.bankTxns],
      ['Pending Dues', '₹' + ov.pendingAmount],
    ];
    doc.setFontSize(7);
    ovRows.forEach((r, i) => {
      const ry = y + 10 + i * 7.2;
      if (i % 2 === 0) { doc.setFillColor(220,252,231); doc.rect(rightX+1, ry-3.5, rightW-2, 7, 'F'); }
      doc.setFont(undefined,'normal'); doc.setTextColor(30,30,30);
      doc.text(String(r[0]), rightX+3, ry);
      doc.setFont(undefined,'bold');
      doc.text(String(r[1]), rightX+rightW-3, ry, { align: 'right' });
    });
  }
  y += 64;

  // ── Note ──
  if (data.note) {
    doc.setFontSize(7.5); doc.setFont(undefined,'bold'); doc.setTextColor(80,80,80);
    doc.text('Note: ', leftX, y+4);
    doc.setFont(undefined,'normal'); doc.text(data.note, leftX+12, y+4);
    y += 8;
  }

  // ── Service Collections (compact table) ──
  if (data.serviceGroups && data.serviceGroups.length > 0) {
    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
    doc.text('Service Collections', leftX, y+5); y += 7;
    doc.autoTable({
      startY: y, margin: { left: leftX, right: 5 }, theme: 'grid',
      headStyles: { fillColor: [67,56,202], textColor: 255, fontSize: 6.5, fontStyle: 'bold', cellPadding: 1.5 },
      bodyStyles: { fontSize: 6.5, cellPadding: 1.5 },
      alternateRowStyles: { fillColor: [238,242,255] },
      head: [['Customer', 'Service(s)', 'Total', 'Paid', 'Due', 'Status']],
      body: data.serviceGroups.map(g => [
        g.customerName,
        g.items.map(i => i.service).join(', ').substring(0, 40),
        '₹'+g.totalAmount, '₹'+g.totalPaid,
        g.totalDue > 0 ? '₹'+g.totalDue : '—', g.status
      ]),
      columnStyles: { 1: { cellWidth: 55 } }
    });
    y = doc.lastAutoTable.finalY + 3;
  }

  // ── Expenses + Banking side by side (if both exist) or stacked ──
  const hasExp = data.todaysExpenses && data.todaysExpenses.length > 0;

  if (hasExp) {
    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(220,38,38);
    doc.text('Expenses', leftX, y+5); y += 7;
    doc.autoTable({
      startY: y, margin: { left: leftX, right: 5 }, theme: 'grid',
      headStyles: { fillColor: [220,38,38], textColor: 255, fontSize: 6.5, fontStyle: 'bold', cellPadding: 1.5 },
      bodyStyles: { fontSize: 6.5, cellPadding: 1.5 }, alternateRowStyles: { fillColor: [254,242,242] },
      head: [['Expense Name', 'Remarks', 'Cost', 'By']],
      body: data.todaysExpenses.map(x => [x.name, x.remarks||'—', '₹'+x.cost, x.staffName||x.addedBy||'—'])
    });
    y = doc.lastAutoTable.finalY + 3;
  }

  // ── Banking Transactions — summary only (Opening Balance, Txn Count, Current Bank Cash,
  //    No. of Withdrawals + Total, No. of Deposits + Total, Total Turnover) — no serial-no-wise listing ──
  {
    const bankRows = data.bankRows || [];
    const totalWithdrawalAmt = bankRows.reduce((s, t) => s + (t.cashOut || 0), 0);
    const totalDepositAmt = bankRows.reduce((s, t) => s + (t.cashIn || 0), 0);
    const withdrawalCount = bankRows.filter(t => (t.cashOut || 0) > 0).length;
    const depositCount = bankRows.filter(t => (t.cashIn || 0) > 0).length;
    const totalTurnover = totalDepositAmt + totalWithdrawalAmt;
    const currentBankCash = (data.bankingCurrentBalance !== undefined) ? data.bankingCurrentBalance : (totalDepositAmt - totalWithdrawalAmt);
    const openingBal = (data.bankingOpeningBalance !== undefined) ? data.bankingOpeningBalance : (currentBankCash - totalDepositAmt + totalWithdrawalAmt);

    doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(37,99,235);
    doc.text('Banking Transactions', leftX, y+5); y += 7;

    // Row 1 — Opening Balance | No. of Transactions | Current Bank Cash
    const stripW = pw - leftX - 5;
    doc.setFillColor(239,246,255);
    doc.roundedRect(leftX, y, stripW, 14, 2, 2, 'F');
    const cellW = stripW / 3;
    const stripItems = [
      ['Opening Balance', '₹' + openingBal],
      ['No. of Transactions', String(bankRows.length)],
      ['Current Bank Cash', '₹' + currentBankCash]
    ];
    stripItems.forEach((item, i) => {
      const cx = leftX + cellW * i + cellW / 2;
      doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(90,90,90);
      doc.text(item[0], cx, y + 5.5, { align: 'center' });
      doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(37,99,235);
      doc.text(item[1], cx, y + 11, { align: 'center' });
    });
    y += 17;

    // Row 2 — No. of Withdrawals + Total | No. of Deposits + Total | Total Turnover
    const gap2 = 5;
    const boxW = (stripW - gap2 * 2) / 3;

    doc.setFillColor(254,242,242);
    doc.roundedRect(leftX, y, boxW, 16, 2, 2, 'F');
    doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(153,27,27);
    doc.text('Withdrawals', leftX + boxW/2, y + 5.5, { align: 'center' });
    doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(220,38,38);
    doc.text(withdrawalCount + ' txns  ·  ₹' + totalWithdrawalAmt, leftX + boxW/2, y + 11.5, { align: 'center' });

    const depX = leftX + boxW + gap2;
    doc.setFillColor(240,253,244);
    doc.roundedRect(depX, y, boxW, 16, 2, 2, 'F');
    doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(22,101,52);
    doc.text('Deposits', depX + boxW/2, y + 5.5, { align: 'center' });
    doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(22,163,74);
    doc.text(depositCount + ' txns  ·  ₹' + totalDepositAmt, depX + boxW/2, y + 11.5, { align: 'center' });

    const turnX = depX + boxW + gap2;
    doc.setFillColor(238,242,255);
    doc.roundedRect(turnX, y, boxW, 16, 2, 2, 'F');
    doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(67,56,202);
    doc.text('Total Turnover', turnX + boxW/2, y + 5.5, { align: 'center' });
    doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
    doc.text('₹' + totalTurnover, turnX + boxW/2, y + 11.5, { align: 'center' });

    y += 21;
  }

  // ── Signature at fixed bottom position ──
  const sigY = ph - 38;
  doc.setDrawColor(180,180,180);
  doc.line(leftX, sigY, pw-5, sigY);

  doc.setFontSize(7); doc.setFont(undefined,'normal'); doc.setTextColor(100,100,100);
  doc.text('Closed by: ' + data.closedBy + '   |   Date: ' + data.date, leftX, sigY+4);

  // Single signature box — "Manager Signature With Seal"
  const sigBoxW = 80;
  const sigBoxX = pw/2 - sigBoxW/2;
  const sigBoxY = sigY + 8;
  doc.setFillColor(248,250,252);
  doc.roundedRect(sigBoxX, sigBoxY, sigBoxW, 24, 2, 2, 'F');
  doc.setDrawColor(150,150,150); doc.roundedRect(sigBoxX, sigBoxY, sigBoxW, 24, 2, 2, 'S');
  doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(67,56,202);
  doc.text('Manager Signature With Seal', pw/2, sigBoxY+5, { align: 'center' });
  doc.setDrawColor(180,180,180); doc.setLineDash([1,1]);
  doc.line(sigBoxX+8, sigBoxY+19, sigBoxX+sigBoxW-8, sigBoxY+19);
  doc.setLineDash([]);
  doc.setFontSize(6.5); doc.setFont(undefined,'normal'); doc.setTextColor(150,150,150);
  doc.text('Authorized Signature & Official Seal', pw/2, sigBoxY+23, { align: 'center' });

  // Footer
  doc.setFontSize(6); doc.setTextColor(180,180,180);
  doc.text('Generated by CSC Management System — ' + new Date().toLocaleString(), pw/2, ph-3, { align: 'center' });

  doc.save('Cash_Closing_Report_' + data.date + '.pdf');
}

// ── GROUPING HELPERS ──
// Multiple services added together for one customer share the same groupId.
// These helpers combine them back into a single logical entry (one receipt,
// one row) wherever tasks are listed, instead of showing each service separately.
function groupTasks(taskList) {
  const map = {};
  (taskList || []).forEach(t => {
    const gid = (t.groupId !== undefined && t.groupId !== null) ? t.groupId : ('single-' + t.id);
    if (!map[gid]) map[gid] = { groupId: gid, customerName: t.customerName, date: t.date, staffName: t.staffName, items: [] };
    map[gid].items.push(t);
    if (t.date > map[gid].date) map[gid].date = t.date;
  });
  return Object.values(map).map(g => {
    const totalAmount = g.items.reduce((s, i) => s + (i.price || 0), 0);
    const totalPaid = g.items.reduce((s, i) => s + (i.paidAmount || 0), 0);
    const totalDue = Math.max(0, totalAmount - totalPaid);
    let status = 'Successful';
    if (g.items.some(i => i.status === 'Pending')) status = 'Pending';
    else if (g.items.some(i => i.status === 'Processing')) status = 'Processing';
    return { ...g, totalAmount, totalPaid, totalDue, status };
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (String(b.groupId)).localeCompare(String(a.groupId))));
}

function receiptFromGroup(g) {
  return {
    groupId: g.groupId, customerName: g.customerName, date: g.date,
    items: g.items.map(i => ({ service: i.service, price: i.price || 0, paidAmount: i.paidAmount || 0 })),
    totalAmount: g.totalAmount, totalPaid: g.totalPaid, totalDue: g.totalDue
  };
}

// Builds a combined receipt for a customer's full visit (used from the CRM list,
// where we only have the customer record, not a pre-grouped task list).
function getCustomerReceipt(customer, tasks) {
  const items = (tasks || []).filter(t =>
    (t.groupId !== undefined && t.groupId !== null) ? t.groupId === customer.id
      : (t.customerName === customer.name && t.date === customer.lastVisit)
  );
  const totalAmount = items.reduce((s, i) => s + (i.price || 0), 0);
  const totalPaid = items.reduce((s, i) => s + (i.paidAmount || 0), 0);
  return {
    groupId: customer.id, customerName: customer.name, date: customer.lastVisit,
    items: items.map(i => ({ service: i.service, price: i.price || 0, paidAmount: i.paidAmount || 0 })),
    totalAmount, totalPaid, totalDue: Math.max(0, totalAmount - totalPaid)
  };
}

// ── DASHBOARD ──
function Dashboard({ tasks, customers, currentUser, setPrintingReceipt, expenses }) {
  const [fromDate, setFromDate] = useState(todayStr);
  const [toDate, setToDate] = useState(todayStr);
  const filtered = tasks.filter(t => t.date >= fromDate && t.date <= toDate);
  const filteredC = customers.filter(c => c.lastVisit >= fromDate && c.lastVisit <= toDate);
  // CORRECT income calculation using paymentHistory:
  // 1. For each task in date range: count only the initial payment (at entry time)
  //    = paidAmount MINUS any later payments recorded in paymentHistory
  // 2. Add paymentHistory entries that fall within the date range (from any task)
  const getInitialPaid = (t) => {
    const laterPayments = (t.paymentHistory || []).reduce((s, p) => s + p.amount, 0);
    return Math.max(0, (t.paidAmount || 0) - laterPayments);
  };
  // Income from tasks whose ENTRY DATE is in range (initial payment only)
  const entryIncome = filtered.reduce((s, t) => s + getInitialPaid(t), 0);
  // Income from paymentHistory entries whose date is in range (from ALL tasks)
  const historyIncome = tasks.reduce((s, t) => {
    const histInRange = (t.paymentHistory || [])
      .filter(p => p.date >= fromDate && p.date <= toDate)
      .reduce((hs, p) => hs + p.amount, 0);
    return s + histInRange;
  }, 0);
  const totalIncomeAdj = entryIncome + historyIncome;
  const totalExpense = (expenses || []).filter(x => x.date >= fromDate && x.date <= toDate).reduce((s, x) => s + x.cost, 0);
  // netProfit now uses totalIncomeAdj (computed above)
  const pending = filtered.filter(t => t.status === 'Pending').length;
  const completed = filtered.filter(t => t.status === 'Successful').length;
  // Pending = tasks where due > 0, based on original entry date
  const pendingAmt = filtered.filter(t => Math.max(0, (t.price || 0) - (t.paidAmount || 0)) > 0)
    .reduce((s, t) => s + Math.max(0, (t.price || 0) - (t.paidAmount || 0)), 0);

  return e('div', { className: 'space-y-6' },
    e('div', { className: 'flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 gap-3' },
      e('div', null, e('h3', { className: 'text-lg font-bold text-gray-800' }, 'Business Overview'), e('p', { className: 'text-sm text-gray-500' }, 'Filter by date range')),
      e('div', { className: 'flex flex-wrap gap-3 items-end' },
        e('div', null, e('label', { className: 'text-xs text-gray-500 block mb-1' }, 'From'), e('input', { type: 'date', value: fromDate, onChange: ev => setFromDate(ev.target.value), className: 'border rounded-md px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-indigo-500' })),
        e('div', null, e('label', { className: 'text-xs text-gray-500 block mb-1' }, 'To'), e('input', { type: 'date', value: toDate, onChange: ev => setToDate(ev.target.value), className: 'border rounded-md px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-indigo-500' })),
        e('button', { onClick: () => exportToExcel(filtered.map(t => ({ Date: t.date, Customer: t.customerName, Service: t.service, Amount: t.price, Status: t.status })), 'Dashboard_Report'), className: 'flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium' }, e(Icon, { name: 'Download', size: 15 }), ' Excel')
      )
    ),
    e('div', { className: `grid gap-4 ${currentUser.role === 'admin' ? 'grid-cols-2 md:grid-cols-4' : 'grid-cols-2 md:grid-cols-3'}` },
      currentUser.role === 'admin' && e(StatCard, { title: 'Total Income', value: `₹${totalIncomeAdj}`, icon: e(Icon, { name: 'TrendingUp', size: 22 }), color: 'bg-green-50 text-green-600' }),
      currentUser.role === 'admin' && e(StatCard, { title: 'Net Profit', value: fmtR(totalIncomeAdj - totalExpense), icon: e(Icon, { name: 'DollarSign', size: 22 }), color: `${(totalIncomeAdj - totalExpense) >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}`, sub: `Expense: ₹${totalExpense}` }),
      e(StatCard, { title: 'Pending Dues', value: `₹${pendingAmt}`, icon: e(Icon, { name: 'AlertCircle', size: 22 }), color: 'bg-red-50 text-red-500' }),
      e(StatCard, { title: 'Customers', value: filteredC.length, icon: e(Icon, { name: 'Users', size: 22 }), color: 'bg-blue-50 text-blue-600' }),
      e(StatCard, { title: 'Pending Tasks', value: pending, icon: e(Icon, { name: 'Clock', size: 22 }), color: 'bg-orange-50 text-orange-600' }),
      e(StatCard, { title: 'Successful', value: completed, icon: e(Icon, { name: 'CheckCircle', size: 22 }), color: 'bg-indigo-50 text-indigo-600' })
    ),
    e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border border-gray-100' },
      e('h4', { className: 'font-bold text-gray-800 mb-4' }, 'Recent Activity'),
      (() => {
        const recentGroups = groupTasks(filtered).slice(0, 6);
        return recentGroups.length === 0 ? e('p', { className: 'text-center text-gray-500 py-4' }, 'No data for selected dates.')
        : e('div', { className: 'space-y-3' }, ...recentGroups.map(g =>

            e('div', { className: 'flex items-center' },
              e('div', { className: `w-2 h-2 rounded-full mr-3 ${g.status === 'Successful' ? 'bg-green-500' : g.status === 'Processing' ? 'bg-blue-500' : 'bg-orange-500'}` }),
              e('div', null, e('p', { className: 'font-medium text-sm' }, g.customerName), e('p', { className: 'text-xs text-gray-500' }, g.items.map(i => i.service).join(', ')))
            ),
            e('div', { className: 'flex items-center gap-3' },
              e('div', { className: 'text-right' },

                e('p', { className: 'text-xs text-gray-500' }, g.date)
              ),
              e('button', { onClick: () => setPrintingReceipt(receiptFromGroup(g)), className: 'text-indigo-500 bg-indigo-50 p-2 rounded-lg hover:bg-indigo-100' }, e(Icon, { name: 'Printer', size: 16 }))

          )
        ));
      })()
    )
  );
}

  const getEffDate = (t) => (t.paymentDate && t.status === 'Successful') ? t.paymentDate : t.date;
  const filteredTasks = tasks.filter(t => getEffDate(t) >= fromDate && getEffDate(t) <= toDate);

    setTasks(tasks.map(t => t.id === id ? { ...t, status: newStatus } : t));

    const task = tasks.find(t => t.id === id);
    const newTasks = tasks.filter(t => t.id !== id);

    const newCustomers = remaining.length === 0 ? customers.filter(c => c.name !== task?.customerName) : customers;

// ── PENDING DUES ──
function PendingDues({ tasks, setTasks, customers, showMessage }) {
  const [fromDate, setFromDate] = useState('2020-01-01');
  const [toDate, setToDate] = useState(todayStr);
  // Show ALL unpaid tasks — use original entry date for filtering here
  const filteredTasks = tasks.filter(t => t.date >= fromDate && t.date <= toDate);
  const pending = groupTasks(filteredTasks).filter(g => g.totalDue > 0);

  const markGroupSuccessful = (groupId) => {
    setTasks(tasks.map(t => {
      if ((t.groupId !== undefined ? t.groupId : t.id) !== groupId) return t;
      const remaining = Math.max(0, (t.price || 0) - (t.paidAmount || 0));
      if (remaining <= 0) return t;
      const hist = [...(t.paymentHistory || []), { date: todayStr, amount: remaining }];
      return { ...t, status: 'Successful', paidAmount: t.price, paymentDate: todayStr, paymentHistory: hist };
    }));
    showMessage('Marked as Successful! Payment date: ' + todayStr);
  };
  const markItemSuccessful = (id) => {
    setTasks(tasks.map(t => {
      if (t.id !== id) return t;
      const remaining = Math.max(0, (t.price || 0) - (t.paidAmount || 0));
      if (remaining <= 0) return t;
      const hist = [...(t.paymentHistory || []), { date: todayStr, amount: remaining }];
      return { ...t, status: 'Successful', paidAmount: t.price, paymentDate: todayStr, paymentHistory: hist };
    }));
    showMessage('Marked as Successful! Payment date: ' + todayStr);
  };
  const setItemStatus = (id, status) => { setTasks(tasks.map(t => t.id === id ? { ...t, status } : t)); showMessage('Status updated'); };

  // Partial payment recording
  const recordPartialPayment = (id, amt) => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const newPaid = Math.min(t.price || 0, (t.paidAmount || 0) + amt);
    const done = newPaid >= (t.price || 0);
    const hist = [...(t.paymentHistory || []), { date: todayStr, amount: amt }];
    setTasks(tasks.map(x =>
      x.id === id
        ? { ...x, paidAmount: newPaid, status: done ? 'Successful' : x.status, paymentDate: todayStr, paymentHistory: hist }
        : x
    ));
    showMessage(done ? 'Fully paid! Payment date: ' + todayStr : '₹' + amt + ' recorded. Remaining: ₹' + ((t.price||0) - newPaid));
  };

  const getCustomer = (name) => customers.find(c => c.name === name);

  const totalDue = pending.reduce((s, g) => s + g.totalDue, 0);

  return e('div', { className: 'space-y-4' },
    e('div', { className: 'flex justify-between items-center' },
      e('div', null, e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Pending Amount'), e('p', { className: 'text-sm text-gray-500' }, 'All pending payments are listed here')),
      e('div', { className: 'bg-red-50 border border-red-200 rounded-xl px-5 py-3 text-center' },
        e('p', { className: 'text-xs text-red-500 font-medium' }, 'Total Due'),
        e('p', { className: 'text-2xl font-bold text-red-600' }, `₹${totalDue}`)
      )
    ),
    e(ExportBar, { fromDate, setFromDate, toDate, setToDate, onExport: () => {
      const rows = pending.map(g => {
        const c = getCustomer(g.customerName);
        return { Customer: g.customerName, Mobile: c?.phone || '', Address: c?.address || '', DOB: c?.dob || '', Services: g.items.map(i => i.service).join(', '), 'Total Amount': g.totalAmount, 'Amount Paid': g.totalPaid, 'Due Amount': g.totalDue, Date: g.date, Status: g.status };
      });
      exportToExcel(rows, `PendingDues_${fromDate}_to_${toDate}`);
    }}),
    pending.length === 0
      ? e('div', { className: 'bg-white rounded-xl p-12 text-center border border-gray-100 shadow-sm' },

                    e('div', null,
                      e('p', { className: 'font-bold text-gray-800' }, g.customerName),
                      e('p', { className: 'text-sm text-gray-500' }, g.items.map(i => i.service).join(', '))
                    )

  const filtered = expenses.filter(x => x.date >= fromDate && x.date <= toDate);

    showAdd && e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border border-gray-100' },
      e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4 mb-4' },
        e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Expense Name *'), e('input', { type: 'text', value: form.name, onChange: ev => setForm({...form, name: ev.target.value}), className: 'w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500', placeholder: 'e.g. Electricity Bill' })),
        e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Cost (₹) *'), e('input', { type: 'number', value: form.cost, onChange: ev => setForm({...form, cost: ev.target.value}), className: 'w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500', placeholder: '0' })),
        e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Date'), e('input', { type: 'date', value: form.date, onChange: ev => setForm({...form, date: ev.target.value}), className: 'w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500' })),
        e('div', { className: 'md:col-span-3' }, e('label', { className: 'block text-sm font-medium mb-1' }, 'Remarks'), e('input', { type: 'text', value: form.remarks, onChange: ev => setForm({...form, remarks: ev.target.value}), className: 'w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500', placeholder: 'Optional note' }))
      ),
      e('button', { onClick: handleAdd, className: 'bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 font-medium' }, 'Save Expense')
    ),
    e('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-auto' },
      e('table', { className: 'w-full text-left' },
        e('thead', { className: 'bg-gray-50 border-b text-gray-600' },
          e('tr', null, e('th', { className: 'p-4 font-medium' }, 'Date'), e('th', { className: 'p-4 font-medium' }, 'Expense Name'), e('th', { className: 'p-4 font-medium' }, 'Remarks'), e('th', { className: 'p-4 font-medium' }, 'Cost'), e('th', { className: 'p-4 font-medium' }, 'Added By'), e('th', { className: 'p-4 font-medium text-right' }, 'Action'))
        ),

          filtered.length === 0
            ? e('tr', null, e('td', { colSpan: 6, className: 'p-8 text-center text-gray-400' }, 'No expenses in this period.'))
            : filtered.slice().reverse().map(x =>
              e('tr', { key: x.id, className: 'hover:bg-gray-50' },

                e('td', { className: 'p-4 text-right' },
                  currentUser.role === 'admin' && e('button', { onClick: () => { setExpenses(expenses.filter(ex => ex.id !== x.id)); showMessage('Deleted', 'error'); }, className: 'text-red-500 bg-red-50 p-1.5 rounded hover:bg-red-100' }, e(Icon, { name: 'Trash2', size: 17 }))

}

// ── BANKING LEDGER (CSP Cash Ledger) ──
function BankingLedger({ bankTransactions, setBankTransactions, openingBalances, setOpeningBalances, archiveBankTransactions, addMoreHistory, setAddMoreHistory, onlineTransactions, accountBalanceExpenses, setAccountBalanceExpenses, accountBalanceOverrides, setAccountBalanceOverrides, currentUser, showMessage, businessProfile }) {
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [form, setForm] = useState({ customerName: '', cashIn: '', cashOut: '', location: 'Bank' });
  const [editingBase, setEditingBase] = useState(false);
  const [baseInput, setBaseInput] = useState(String(openingBalances[todayStr] || 0));
  const [showArchive, setShowArchive] = useState(false);
  const [archFrom, setArchFrom] = useState('');
  const [archTo, setArchTo] = useState('');
  const [showAddMore, setShowAddMore] = useState(false);
  const [addMoreInput, setAddMoreInput] = useState('');
  const [editingAccBal, setEditingAccBal] = useState(false);
  const [accBalInput, setAccBalInput] = useState('');
  const [bankingTab, setBankingTab] = useState('ledger');
  const [expForm, setExpForm] = useState({ name: '', cost: '', date: todayStr, remarks: '' }); // 'ledger' | 'reports'

  // ── Reports tab state ──
  const oneYearAgo = todayStr.slice(0,4) + '-01-01';
  const [rptFrom, setRptFrom] = useState(oneYearAgo);
  const [rptTo,   setRptTo]   = useState(todayStr);

  const todays = bankTransactions.filter(t => t.date === selectedDate).sort((a, b) => a.id - b.id);
  // Opening Balance is exactly what was manually typed in for this date — nothing else is added to it.
  const openingBalance = openingBalances[selectedDate] || 0;

  // Online transactions for selected date
  const safeOnline = Array.isArray(onlineTransactions) ? onlineTransactions : [];
  const onlineTodays = safeOnline.filter(t => t.date === selectedDate);
  const onlineReceivedToday  = onlineTodays.filter(t => t.type === 'received').reduce((s, t) => s + (t.amount || 0), 0);
  const onlineTransferToday  = onlineTodays.filter(t => t.type === 'transfer').reduce((s, t) => s + (t.amount || 0), 0);

  // Banking transactions for selected date
  const bankDeposit    = todays.reduce((s, t) => s + (t.cashIn  || 0), 0);
  const bankWithdrawal = todays.reduce((s, t) => s + (t.cashOut || 0), 0);

  // Combined: Online Received adds to Withdrawal side, Online Transfer adds to Deposit side
  const totalDeposit    = bankDeposit    + onlineTransferToday;
  const totalWithdrawal = bankWithdrawal + onlineReceivedToday;
  const currentBalance  = openingBalance + totalDeposit - totalWithdrawal;

  let running = openingBalance;
  const rows = todays.map(t => { running += (t.cashIn || 0) - (t.cashOut || 0); return { ...t, runningBalance: running }; });

  // ── Account Balance (all-time) ──
  const allTxns = bankTransactions;
  const allOnlineReceived = safeOnline.filter(t => t.type === 'received').reduce((s, t) => s + (t.amount || 0), 0);
  const allOnlineTransfer = safeOnline.filter(t => t.type === 'transfer').reduce((s, t) => s + (t.amount || 0), 0);
  const allTimeWithdrawal = allTxns.reduce((s, t) => s + (t.cashOut || 0), 0) + allOnlineReceived;
  const allTimeDeposit    = allTxns.reduce((s, t) => s + (t.cashIn  || 0), 0) + allOnlineTransfer;
  const allTimeAddMore    = Object.values((addMoreHistory && typeof addMoreHistory === 'object') ? addMoreHistory : {}).flat().filter(x => typeof x === 'number').reduce((s, a) => s + (Number(a) || 0), 0);
  const allAccExpenses    = (accountBalanceExpenses || []).reduce((s, x) => s + (x.cost || 0), 0);
  const computedAccountBalance = allTimeWithdrawal - allTimeDeposit - allTimeAddMore - allAccExpenses;
  const overrides = (accountBalanceOverrides && typeof accountBalanceOverrides === 'object') ? accountBalanceOverrides : {};
  const hasOverride = Object.prototype.hasOwnProperty.call(overrides, selectedDate);
  const accountBalance = hasOverride ? Number(overrides[selectedDate]) || 0 : computedAccountBalance;

  const handleAdd = () => {
    if (!form.customerName) return showMessage('Please enter Customer Name / Details.', 'error');
    const cashIn = Number(form.cashIn) || 0;
    const cashOut = Number(form.cashOut) || 0;
    if (cashIn === 0 && cashOut === 0) return showMessage('Please enter a Cash IN or Cash OUT amount.', 'error');
    setBankTransactions([...bankTransactions, { id: Date.now(), date: selectedDate, customerName: form.customerName, cashIn, cashOut, location: form.location, staffId: currentUser.id, staffName: currentUser.name }]);
    setForm(f => ({ ...f, customerName: '', cashIn: '', cashOut: '' }));
    showMessage(`Transaction added (${form.location})!`);
  };

  const deleteTxn = (id) => { setBankTransactions(bankTransactions.filter(t => t.id !== id)); showMessage('Deleted', 'error'); };

  const saveBase = () => {
    setOpeningBalances({ ...openingBalances, [selectedDate]: Number(baseInput) || 0 });
    setEditingBase(false);
    showMessage(`${selectedDate} এর Opening Balance সেট হয়ে গেছে!`);
  };

  const handleAddMore = () => {
    const amt = Number(addMoreInput) || 0;
    if (!amt || amt <= 0) return showMessage('Please enter a valid amount.', 'error');
    const current = openingBalances[selectedDate] || 0;
    const newBal = current + amt;
    setOpeningBalances({ ...openingBalances, [selectedDate]: newBal });
    // Track Add More separately for Account Balance calculation
    const safeHistory = (addMoreHistory && typeof addMoreHistory === 'object') ? addMoreHistory : {};
    const existing = safeHistory[selectedDate] || [];
    setAddMoreHistory({ ...safeHistory, [selectedDate]: [...existing, amt] });
    setAddMoreInput('');
    setShowAddMore(false);
    showMessage('₹' + amt + ' added! New Opening Balance: ₹' + newBal);
  };

  const saveAccBal = () => {
    const val = Number(accBalInput);
    if (accBalInput === '' || isNaN(val)) return showMessage('Please enter a valid amount.', 'error');
    setAccountBalanceOverrides({ ...overrides, [selectedDate]: val });
    setEditingAccBal(false);
    setAccBalInput('');
    showMessage(`${selectedDate} এর Account Balance সেট হয়ে গেছে!`);
  };
  const clearAccBal = () => {
    if (!hasOverride) return;
    const next = { ...overrides };
    delete next[selectedDate];
    setAccountBalanceOverrides(next);
    setEditingAccBal(false);
    setAccBalInput('');
    showMessage(`${selectedDate} এর Account Balance override সরানো হয়েছে (auto-calc)`);
  };

  const exportLedger = () => {
    const aoa = [
      [null, 'WEST BENGAL GRAMIN BANK CSP - DAILY CASH LEDGER'],
      [],
      [null, 'OPENING BALANCE', 'TOTAL CASH DEPOSIT (+)', 'TOTAL WITHDRAWAL (-)', '    CURRENT TOTAL BALANCE'],
      [null, openingBalance, totalDeposit, totalWithdrawal, currentBalance],
      [null, "TODAY'S DATE"],
      [null, selectedDate],
      ['Sl. No.', 'Customer Name / Details', 'Cash IN / Deposit (+)', 'Cash OUT / Withdraw (-)', 'Location', 'Running Balance'],
      ...rows.map((r, idx) => [idx + 1, r.customerName, r.cashIn || '', r.cashOut || '', r.location || 'Bank', r.runningBalance])
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Cash Ledger');
    XLSX.writeFile(wb, `Banking_Ledger_${selectedDate}.xlsx`);
  };

  const handleArchive = () => {
    if (!archFrom || !archTo) return showMessage('Please select From and To dates to archive.', 'error');
    if (archFrom > archTo) return showMessage('From date cannot be after To date.', 'error');
    const toArchive = bankTransactions.filter(t => t.date >= archFrom && t.date <= archTo).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id));
    if (toArchive.length === 0) return showMessage('No banking entries found in this date range.', 'error');
    const totalIn = toArchive.reduce((s, t) => s + (t.cashIn || 0), 0);
    const totalOut = toArchive.reduce((s, t) => s + (t.cashOut || 0), 0);
    const ok = window.confirm(`${toArchive.length} banking entries from ${archFrom} to ${archTo} will be exported to Excel and permanently removed from this ledger. Opening balances are stored separately so other days will not be affected.\n\nProceed?`);
    if (!ok) return;
    const archiveAoa = [
      [null, 'WEST BENGAL GRAMIN BANK CSP - CASH LEDGER (ARCHIVED)'],
      [null, `Period: ${archFrom} to ${archTo}`],
      [],
      ['Date', 'Customer Name / Details', 'Cash IN / Deposit (+)', 'Cash OUT / Withdraw (-)', 'Location'],
      ...toArchive.map(t => [t.date, t.customerName, t.cashIn || '', t.cashOut || '', t.location || 'Bank']),
      [],
      [null, null, 'Total Deposit', totalIn],
      [null, null, 'Total Withdrawal', totalOut],
      [null, null, 'Net Effect', totalIn - totalOut]
    ];
    const aws = XLSX.utils.aoa_to_sheet(archiveAoa);
    const awb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(awb, aws, 'Archived Ledger');
    XLSX.writeFile(awb, `Banking_Archive_${archFrom}_to_${archTo}.xlsx`);
    archiveBankTransactions(archFrom, archTo);
    setShowArchive(false); setArchFrom(''); setArchTo('');
    showMessage('Archive complete! Excel downloaded and old entries removed.');
  };

  return e('div', { className: 'space-y-4' },
    // ── Tab switcher: Ledger | Reports ──
    e('div', { className: 'flex gap-2 border-b border-gray-100 pb-3' },
      e('button', { onClick: () => setBankingTab('ledger'), className: 'px-5 py-2 rounded-lg font-medium text-sm transition-colors ' + (bankingTab==='ledger' ? 'bg-green-700 text-white shadow' : 'bg-white border border-gray-200 text-gray-600 hover:bg-green-50') }, 'Ledger'),
      e('button', { onClick: () => setBankingTab('reports'), className: 'px-5 py-2 rounded-lg font-medium text-sm transition-colors ' + (bankingTab==='reports' ? 'bg-green-700 text-white shadow' : 'bg-white border border-gray-200 text-gray-600 hover:bg-green-50') }, 'Reports'),
      e('button', { onClick: () => setBankingTab('accexpense'), className: 'px-5 py-2 rounded-lg font-medium text-sm transition-colors ' + (bankingTab==='accexpense' ? 'bg-red-600 text-white shadow' : 'bg-white border border-gray-200 text-gray-600 hover:bg-red-50') }, 'Acc. Balance Expense')
    ),

    bankingTab === 'ledger' && e('div', { className: 'space-y-4' },
    e('div', { className: 'flex flex-wrap justify-between items-start gap-3' },
      e('div', null, e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Banking Ledger'), e('p', { className: 'text-sm text-gray-500' }, 'CSP cash deposit / withdrawal — daily ledger')),
      e('div', { className: 'flex flex-wrap items-center gap-2' },
        e('div', null, e('label', { className: 'text-xs text-gray-500 block mb-1' }, 'Date'), e('input', { type: 'date', value: selectedDate, onChange: ev => setSelectedDate(ev.target.value), className: 'border rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-indigo-500' })),
        e('button', { onClick: exportLedger, className: 'flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm' }, e(Icon, { name: 'Download', size: 16 }), ' Export'),
        currentUser.role === 'admin' && e('button', { onClick: () => setShowArchive(!showArchive), className: 'flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm' }, e(Icon, { name: 'Trash2', size: 16 }), ' Archive'),
        currentUser.role === 'admin' && e('button', {
          onClick: () => {
            const ok = window.confirm('Are you sure you want to RESET all Banking data?\n\nThis will clear:\n\u2022 All Banking transactions\n\u2022 All Opening Balances\n\u2022 Add More Balance history\n\u2022 Account Balance\n\nThis action cannot be undone!');
            if (!ok) return;
            setBankTransactions([]);
            setOpeningBalances({});
            setAddMoreHistory({});
            setAccountBalanceOverrides({});
            showMessage('Banking data reset to zero!', 'error');
          },
          className: 'flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm'
        }, e(Icon, { name: 'RefreshCw', size: 16 }), ' Reset All')
      )
    ),

    e('div', { className: 'bg-gradient-to-r from-purple-600 to-indigo-700 rounded-xl p-4 text-white flex items-center justify-between shadow-md' },
      e('div', null,
        e('p', { className: 'text-purple-200 text-xs font-medium uppercase tracking-widest mb-1' },
          'Account Balance',
          hasOverride && e('span', { className: 'ml-2 bg-yellow-400 text-yellow-900 text-[10px] px-1.5 py-0.5 rounded font-bold' }, 'MANUAL · ' + selectedDate)
        ),
        e('p', { className: 'text-3xl font-bold' }, '₹' + accountBalance.toLocaleString('en-IN')),
        e('p', { className: 'text-purple-200 text-xs mt-1.5' },
          hasOverride
            ? ('Manually set for ' + selectedDate + ' · Auto-calc would be ₹' + computedAccountBalance.toLocaleString('en-IN'))
            : ('Withdrawal ₹' + allTimeWithdrawal.toLocaleString('en-IN') +
               '  −  Deposit ₹' + allTimeDeposit.toLocaleString('en-IN') +
               '  −  Add More ₹' + allTimeAddMore.toLocaleString('en-IN'))
        )
      ),
      e('div', { className: 'flex items-center gap-2' },
        currentUser.role === 'admin' && e('button', {
          onClick: () => { setAccBalInput(String(hasOverride ? overrides[selectedDate] : computedAccountBalance)); setEditingAccBal(true); },
          title: 'Set Account Balance for ' + selectedDate,
          className: 'bg-white bg-opacity-20 hover:bg-opacity-30 p-2 rounded-lg transition-colors'
        }, e(Icon, { name: 'Edit3', size: 18 })),
        e('div', { className: 'bg-white bg-opacity-20 p-3 rounded-xl' }, e(Icon, { name: 'Landmark', size: 28 }))
      )
    ),

    editingAccBal && e('div', { className: 'bg-white p-4 rounded-xl shadow-sm border border-purple-200 flex flex-wrap items-end gap-3' },
      e('div', { className: 'flex-1 min-w-64' },
        e('label', { className: 'block text-sm font-medium mb-1 text-gray-700' }, 'Set Account Balance — ' + selectedDate),
        e('p', { className: 'text-xs text-gray-400 mb-2' }, 'এই মান শুধু ' + selectedDate + ' এর জন্য apply হবে। Auto-calc বাদ যাবে।'),
        e('div', { className: 'flex items-center gap-2' },
          e('span', { className: 'text-purple-700 font-bold text-lg' }, '₹'),
          e('input', { type: 'number', value: accBalInput, onChange: ev => setAccBalInput(ev.target.value), className: 'border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-purple-500 w-48', placeholder: '0' })
        )
      ),
      e('button', { onClick: saveAccBal, className: 'bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 text-sm font-medium' }, 'Save'),
      hasOverride && e('button', { onClick: clearAccBal, className: 'bg-gray-100 text-gray-700 border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-200 text-sm font-medium' }, 'Reset to Auto'),
      e('button', { onClick: () => { setEditingAccBal(false); setAccBalInput(''); }, className: 'text-gray-500 px-4 py-2 text-sm' }, 'Cancel')
    ),

    e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-4' },
      e('div', { className: 'relative' },
        e(StatCard, { title: `Opening Balance (${selectedDate})`, value: `₹${openingBalance}`, icon: e(Icon, { name: 'Landmark', size: 22 }), color: 'bg-indigo-50 text-indigo-600' }),
        currentUser.role === 'admin' && e('div', { className: 'absolute top-1 right-1 flex gap-0.5' },
          e('button', {
            onClick: () => { setAddMoreInput(''); setShowAddMore(true); setEditingBase(false); },
            title: 'Add More Balance',
            className: 'text-green-500 hover:text-green-700 p-1.5 rounded hover:bg-green-50'
          }, e(Icon, { name: 'PlusCircle', size: 15 })),
          e('button', {
            onClick: () => { setBaseInput(String(openingBalances[selectedDate] || 0)); setEditingBase(true); setShowAddMore(false); },
            title: 'Edit Opening Balance',
            className: 'text-gray-400 hover:text-indigo-600 p-1.5 rounded hover:bg-indigo-50'
          }, e(Icon, { name: 'Edit3', size: 15 }))
        )
      ),
      e(StatCard, { title: 'Total Deposit (+)', value: `₹${totalDeposit}`, icon: e(Icon, { name: 'TrendingUp', size: 22 }), color: 'bg-green-50 text-green-600' }),
      e(StatCard, { title: 'Total Withdrawal (-)', value: `₹${totalWithdrawal}`, icon: e(Icon, { name: 'TrendingDown', size: 22 }), color: 'bg-red-50 text-red-500' }),
      e(StatCard, { title: 'Current Balance', value: fmtR(currentBalance), icon: e(Icon, { name: 'DollarSign', size: 22 }), color: 'bg-blue-50 text-blue-600' })
    ),

    editingBase && e('div', { className: 'bg-white p-4 rounded-xl shadow-sm border border-indigo-200 flex flex-wrap items-end gap-3' },
      e('div', null,
        e('label', { className: 'block text-sm font-medium mb-1 text-gray-700' }, 'Set Opening Balance — ' + selectedDate),
        e('p', { className: 'text-xs text-gray-400 mb-2' }, 'Whatever you enter will replace the previous balance'),

      ),
      e('button', { onClick: saveBase, className: 'bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium' }, 'Save'),
      e('button', { onClick: () => setEditingBase(false), className: 'text-gray-500 px-4 py-2 text-sm' }, 'Cancel')
    ),

    showAddMore && e('div', { className: 'bg-green-50 p-4 rounded-xl shadow-sm border border-green-300 flex flex-wrap items-end gap-4' },
      e('div', null,
        e('label', { className: 'block text-sm font-semibold text-green-800 mb-1' }, 'Add More Balance — ' + selectedDate),
        e('p', { className: 'text-xs text-green-600 mb-3' }, 'This amount will be added to the current Opening Balance'),
        e('div', { className: 'flex items-center gap-2' },
          e('span', { className: 'text-green-700 font-bold' }, '₹'),
          e('input', { type: 'number', value: addMoreInput, onChange: ev => setAddMoreInput(ev.target.value), className: 'border border-green-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500 w-44 text-sm', placeholder: '0' })

        e('div', { className: 'flex justify-between gap-4 text-gray-500' },
          e('span', null, 'Current Balance:'),

// Read-only combined view: pulls numbers from tasks (service collection), bankTransactions
// (CSP deposit/withdraw) and expenses — does NOT write to any of those lists, so the
// Service Tracking / Pending Amount / Banking / Expenses menus are completely unaffected.
// Only writes to its own new field: cashClosingLogs.
function DailyCashClosing({ tasks, expenses, bankTransactions, bankingOpeningBalances, cashClosingLogs, setCashClosingLogs, customers, currentUser, showMessage, businessProfile }) {
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [actualInput, setActualInput] = useState('');
  const [noteInput, setNoteInput] = useState('');
  const [histFrom, setHistFrom] = useState(curMonth + '-01');
  const [histTo, setHistTo] = useState(todayStr);

  const collectedOf = (t) => t.paidAmount !== undefined ? t.paidAmount : (t.status === 'Successful' ? t.price : 0);

  const todaysTasks = tasks.filter(t => t.date === selectedDate);
  const todaysExpenses = expenses.filter(x => x.date === selectedDate);
  const todaysBankTxns = bankTransactions.filter(t => t.date === selectedDate);
  const todaysNewCustomers = (customers || []).filter(c => c.lastVisit === selectedDate);

  // 1) Total Income — same definition as the Dashboard's "Total Income" card, for this single day.
  const totalIncome = todaysTasks.reduce((s, t) => s + collectedOf(t), 0);
  // 2) Total Expense — same as the Expenses menu, for this single day.
  const expenseTotal = todaysExpenses.reduce((s, x) => s + x.cost, 0);
  // 3) Net Profit — exactly the Dashboard's "Net Profit" card formula, for this single day.
  const netProfit = totalIncome - expenseTotal;
  // 4) Banking Current Balance — exactly the Banking Ledger's own "Current Balance" for this date
  //    (that day's manually-set Opening Balance + that day's deposits/withdrawals).
  const bankDeposit = todaysBankTxns.reduce((s, t) => s + (t.cashIn || 0), 0);
  const bankWithdraw = todaysBankTxns.reduce((s, t) => s + (t.cashOut || 0), 0);
  const bankingOpening = bankingOpeningBalances[selectedDate] || 0;
  const bankingCurrentBalance = bankingOpening + bankDeposit - bankWithdraw;

  // Expected Closing Cash:
  // If Banking Current Balance is negative → Expected Closing Cash = Banking Current Balance (same value)
  // If Banking Current Balance is zero or positive → Net Profit + Banking Current Balance
  const expectedClosing = bankingCurrentBalance < 0 ? bankingCurrentBalance : netProfit + bankingCurrentBalance;

function generateSalarySlipPDF(u, selMonth, info, bp) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pw = doc.internal.pageSize.getWidth();
  const [yr, mo] = selMonth.split('-').map(Number);
  const monthLabel = new Date(yr, mo - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

  // ── Header ──
  doc.setFillColor(67, 56, 202);
  doc.rect(0, 0, pw, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16); doc.setFont(undefined, 'bold');
  doc.text((bp && bp.name) || 'CSC Center', pw / 2, 10, { align: 'center' });
  doc.setFontSize(7.5); doc.setFont(undefined, 'normal');
  doc.text([(bp && bp.address) || '', 'CSC ID: ' + ((bp && bp.cscId) || '') + '   |   ' + ((bp && bp.phone) || '')].join('   '), pw / 2, 17, { align: 'center' });
  doc.setFontSize(12); doc.setFont(undefined, 'bold');
  doc.text('SALARY SLIP', pw / 2, 24, { align: 'center' });

  doc.setTextColor(30, 30, 30);
  let y = 34;

  // Month banner
  doc.setFillColor(238, 242, 255);
  doc.roundedRect(10, y, pw - 20, 10, 2, 2, 'F');
  doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.setTextColor(67, 56, 202);
  doc.text('Month: ' + monthLabel, pw / 2, y + 6.5, { align: 'center' });
  y += 14;

  // Staff details
  doc.setTextColor(30, 30, 30);
  doc.setFontSize(9.5); doc.setFont(undefined, 'bold');
  doc.text('Staff Details', 12, y); y += 5;
  doc.setDrawColor(200, 200, 220); doc.line(12, y, pw - 12, y); y += 4;
  doc.setFont(undefined, 'normal'); doc.setFontSize(9);
  doc.text('Name:', 12, y); doc.setFont(undefined, 'bold'); doc.text(u.name || '', 45, y);
  doc.setFont(undefined, 'normal'); doc.text('Role:', pw / 2, y); doc.setFont(undefined, 'bold'); doc.text((u.role || '').toUpperCase(), pw / 2 + 18, y);
  y += 7; doc.setFont(undefined, 'normal');
  doc.text('User ID:', 12, y); doc.setFont(undefined, 'bold'); doc.text(String(u.id || ''), 45, y);
  y += 8;

  // Attendance
  doc.setFontSize(9.5); doc.setFont(undefined, 'bold');
  doc.text('Attendance', 12, y); y += 5;
  doc.line(12, y, pw - 12, y); y += 4;
  doc.setFontSize(9); doc.setFont(undefined, 'normal');
  const daysInM = new Date(yr, mo, 0).getDate();
  const rows1 = [
    ['Days in Month', String(daysInM)],
    ['Days Present', String(info.daysWorked)],
    ['Days Absent', String(daysInM - info.daysWorked)],
  ];
  rows1.forEach(([label, val]) => {
    doc.text(label + ':', 14, y); doc.setFont(undefined, 'bold'); doc.text(val, 70, y); doc.setFont(undefined, 'normal'); y += 6;
  });
  y += 2;

  // Salary Calculation table
  doc.setFontSize(9.5); doc.setFont(undefined, 'bold');
  doc.text('Salary Calculation', 12, y); y += 5;
  doc.line(12, y, pw - 12, y); y += 2;

  doc.autoTable({
    startY: y,
    margin: { left: 12, right: 12 },
    theme: 'grid',
    headStyles: { fillColor: [67, 56, 202], textColor: 255, fontSize: 9, fontStyle: 'bold', cellPadding: 3 },
    bodyStyles: { fontSize: 9, cellPadding: 3 },
    alternateRowStyles: { fillColor: [245, 245, 255] },
    head: [['Description', 'Details', 'Amount']],
    body: [
      ['Daily Rate',         String(info.daysWorked) + ' days × ₹' + info.rate + '/day', '₹' + info.grossSalary],
      ['Advance Deduction',  'Total advance this month',    info.totalAdvMonth > 0 ? '-₹' + info.totalAdvMonth : '—'],
      ['Net Salary',         'Gross - Advance',              '₹' + info.netSalary],
      ['Amount Paid',        'Salary paid this month',       '₹' + info.totalPaidMonth],
      ['Balance Due',        info.balanceDue > 0 ? 'Remaining to be paid' : 'Fully paid', info.balanceDue > 0 ? '₹' + info.balanceDue : '✓ Paid'],
    ],
    didParseCell: function (data) {
      if (data.row.index === 2) data.cell.styles.fontStyle = 'bold';
      if (data.row.index === 4) {
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.textColor = info.balanceDue > 0 ? [220, 38, 38] : [22, 163, 74];
      }
    }
  });
  y = doc.lastAutoTable.finalY + 8;

  // Note
  doc.setFontSize(7.5); doc.setFont(undefined, 'italic'); doc.setTextColor(120, 120, 120);
  doc.text('This is a computer generated salary slip. Please verify with your records.', pw / 2, y, { align: 'center' });
  y += 10;

  // ── Signature Section ──
  const sigY = Math.max(y, 235);
  doc.setTextColor(30, 30, 30);
  doc.setDrawColor(100, 100, 140);
  // Manager signature box
  doc.setFillColor(248, 250, 252);
  doc.roundedRect(12, sigY, 75, 30, 3, 3, 'FD');
  doc.setFontSize(7.5); doc.setFont(undefined, 'bold');
  doc.text('Manager / Authorized Signatory', 49, sigY + 6, { align: 'center' });
  doc.setDrawColor(150, 150, 180); doc.line(20, sigY + 22, 80, sigY + 22);
  doc.setFont(undefined, 'normal'); doc.setFontSize(7);
  doc.text('Signature', 49, sigY + 27, { align: 'center' });
  // Staff signature box
  doc.setFillColor(248, 250, 252);
  doc.roundedRect(pw - 87, sigY, 75, 30, 3, 3, 'FD');
  doc.setFontSize(7.5); doc.setFont(undefined, 'bold');
  doc.text('Staff / Employee', pw - 87 + 37.5, sigY + 6, { align: 'center' });
  doc.setDrawColor(150, 150, 180); doc.line(pw - 80, sigY + 22, pw - 20, sigY + 22);
  doc.setFont(undefined, 'normal'); doc.setFontSize(7);
  doc.text(u.name || 'Employee', pw - 87 + 37.5, sigY + 27, { align: 'center' });

  // Page footer
  doc.setFontSize(6.5); doc.setTextColor(160, 160, 160); doc.setFont(undefined, 'normal');
  doc.text('Generated on ' + new Date().toLocaleString('en-IN'), pw / 2, 292, { align: 'center' });

  doc.save('SalarySlip_' + (u.name || 'Staff').replace(/\s+/g, '_') + '_' + selMonth + '.pdf');
}

function StaffSalary({ users, appData, persist, showMessage, currentUser, businessProfile }) {
  const isAdmin = currentUser && currentUser.role === 'admin';
  const salaryData = appData.salaryData || {};

  const months = [];
  for (let y = 2024; y <= new Date().getFullYear() + 1; y++)
    for (let m = 1; m <= 12; m++) months.push(`${y}-${String(m).padStart(2,'0')}`);
  const currentMonth = todayStr.slice(0,7);

  // Operator: force own ID; Admin: can pick any staff
  const defaultSelUser = isAdmin
    ? (users.find(u => u.role !== 'admin')?.id || users[0]?.id)
    : (currentUser ? currentUser.id : users[0]?.id);

  const [selUser,  setSelUser]  = useState(defaultSelUser);
  const [selMonth, setSelMonth] = useState(currentMonth);
  const [subTab,   setSubTab]   = useState('attendance');
  const [dailyRate,setDailyRate]= useState('');
  const [editRate, setEditRate] = useState(false);
  const [advAmt,   setAdvAmt]   = useState('');
  const [advNote,  setAdvNote]  = useState('');
  const [payAmt,   setPayAmt]   = useState('');
  const [payNote,  setPayNote]  = useState('');

  const staff = users.find(u => u.id === selUser);
  const sd    = salaryData[selUser] || { dailyRate: 0, attendance: {}, advances: [], payments: [] };
  const [yr, mo] = selMonth.split('-').map(Number);
  const daysInMonth = new Date(yr, mo, 0).getDate();
  const daysList = Array.from({ length: daysInMonth }, (_, i) => `${selMonth}-${String(i+1).padStart(2,'0')}`);

  const attendance    = sd.attendance || {};
  const advances      = (sd.advances  || []).filter(a => a.date.startsWith(selMonth));
  const payments      = (sd.payments  || []).filter(p => p.month === selMonth);
  const daysWorked    = daysList.filter(d => attendance[d]).length;
  const rate          = Number(sd.dailyRate) || 0;
  const grossSalary   = daysWorked * rate;
  const totalAdvMonth = advances.reduce((s,a) => s + Number(a.amount), 0);
  const totalPaidMonth= payments.reduce((s,p) => s + Number(p.amount), 0);
  const netSalary     = Math.max(0, grossSalary - totalAdvMonth);
  const balanceDue    = Math.max(0, netSalary - totalPaidMonth);

  const updateSD = (uid, patch) => {
    if (!isAdmin) return;
    const prev = salaryData[uid] || { dailyRate:0, attendance:{}, advances:[], payments:[] };
    persist({ ...appData, salaryData: { ...salaryData, [uid]: { ...prev, ...patch } } });
  };

  const toggleAttendance = (date) => {
    if (!isAdmin) return;
    const att = { ...sd.attendance };
    att[date] ? delete att[date] : (att[date] = true);
    updateSD(selUser, { attendance: att });
  };

  const saveRate = () => {
    if (!isAdmin) return;
    if (!dailyRate || isNaN(dailyRate)) return showMessage('Enter valid daily rate', 'error');
    updateSD(selUser, { dailyRate: Number(dailyRate) });
    setEditRate(false); showMessage('Daily rate saved!');
  };

  const addAdvance = () => {
    if (!isAdmin) return;
    if (!advAmt || isNaN(advAmt)) return showMessage('Enter valid amount', 'error');
    updateSD(selUser, { advances: [...(sd.advances||[]), { id: Date.now(), date: todayStr, amount: Number(advAmt), note: advNote || 'Advance' }] });
    setAdvAmt(''); setAdvNote(''); showMessage('Advance recorded!');
  };

  const addPayment = () => {
    if (!isAdmin) return;
    if (!payAmt || isNaN(payAmt)) return showMessage('Enter valid amount', 'error');
    updateSD(selUser, { payments: [...(sd.payments||[]), { id: Date.now(), month: selMonth, date: todayStr, amount: Number(payAmt), note: payNote || 'Salary Payment' }] });
    setPayAmt(''); setPayNote(''); showMessage('Payment recorded!');
  };

  const getSalaryInfo = (uid) => {
    const usd = salaryData[uid] || { dailyRate:0, attendance:{}, advances:[], payments:[] };
    const uRate = Number(usd.dailyRate) || 0;
    const uDays = daysList.filter(d => (usd.attendance||{})[d]).length;
    const uGross = uDays * uRate;
    const uAdv = (usd.advances||[]).filter(a=>a.date.startsWith(selMonth)).reduce((s,a)=>s+Number(a.amount),0);
    const uPaid = (usd.payments||[]).filter(p=>p.month===selMonth).reduce((s,p)=>s+Number(p.amount),0);
    const uNet = Math.max(0, uGross - uAdv);
    const uBal = Math.max(0, uNet - uPaid);
    return { rate: uRate, daysWorked: uDays, grossSalary: uGross, totalAdvMonth: uAdv, totalPaidMonth: uPaid, netSalary: uNet, balanceDue: uBal };
  };

  const tabBtn = (id, label, icon) => e('button', {
    onClick: () => setSubTab(id),
    className: `flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${subTab===id ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'}`
  }, e(Icon,{name:icon,size:15}), label);

    e(Icon, { name: 'Eye', size: 16 }),
    'View only — শুধু দেখতে পাবেন, কোনো পরিবর্তন করার অনুমতি নেই।'
  );

  return e('div', { className: 'space-y-5' },
    e('div', { className: 'flex justify-between items-center' },
      e('div', null,
        e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Staff Salary Management'),

    ),

    readOnlyBanner,

      isAdmin && e('div', { className: 'flex flex-col gap-1' },
        e('label', { className: 'text-xs font-medium text-gray-500' }, 'Select Staff'),
        e('select', { value: selUser, onChange: ev => setSelUser(Number(ev.target.value)), className: 'border rounded-lg px-3 py-2 bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-500 min-w-44' },
          ...users.map(u => e('option', { key: u.id, value: u.id }, u.name + ' (' + u.role + ')'))
        )
      ),
      !isAdmin && e('div', { className: 'flex items-center gap-2 bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2' },
        e(Icon, { name: 'User', size: 15, className: 'text-indigo-500' }),
        e('span', { className: 'text-sm font-semibold text-indigo-800' }, staff ? staff.name : '')

      e('div', { className: 'flex flex-col gap-1' },

          ...months.slice().reverse().map(m => {
            const [y2,m2] = m.split('-');

      e('div', { className: 'flex items-end gap-2' },
        !editRate
          ? e('div', { className: 'flex items-center gap-2 bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2' },
              e('span', { className: 'text-xs text-indigo-500 font-medium' }, 'Daily Rate:'),
              e('span', { className: 'text-indigo-800 font-bold' }, '\u20B9' + rate),
              isAdmin && e('button', { onClick: () => { setDailyRate(String(rate)); setEditRate(true); }, className: 'ml-2 text-indigo-500 hover:text-indigo-700' }, e(Icon,{name:'Pencil',size:14}))

// ── ONLINE TRANSACTION ──
function OnlineTransaction({ onlineTransactions, setOnlineTransactions, currentUser, showMessage }) {
  const safe = Array.isArray(onlineTransactions) ? onlineTransactions : [];
  const [tab, setTab]           = useState('received'); // 'received' | 'transfer'
  const [form, setForm]         = useState({ name: '', amount: '' });
  const [fromDate, setFromDate] = useState(todayStr);
  const [toDate, setToDate]     = useState(todayStr);

  const filtered = safe.filter(t => t.type === tab && t.date >= fromDate && t.date <= toDate);
  const totalReceived = safe.filter(t => t.type === 'received' && t.date >= fromDate && t.date <= toDate).reduce((s, t) => s + (t.amount || 0), 0);
  const totalTransfer = safe.filter(t => t.type === 'transfer' && t.date >= fromDate && t.date <= toDate).reduce((s, t) => s + (t.amount || 0), 0);

  const handleAdd = () => {
    if (!form.name.trim()) return showMessage('Please enter a name / details.', 'error');
    const amt = Number(form.amount) || 0;
    if (amt <= 0) return showMessage('Please enter a valid amount.', 'error');
    const newTxn = { id: Date.now(), type: tab, name: form.name.trim(), amount: amt, date: todayStr, staffId: currentUser.id, staffName: currentUser.name };
    setOnlineTransactions([...safe, newTxn]);
    setForm({ name: '', amount: '' });
    showMessage((tab === 'received' ? 'Money Received' : 'Money Transfer') + ' entry added!');
  };

  const deleteTxn = (id) => {
    setOnlineTransactions(safe.filter(t => t.id !== id));
    showMessage('Deleted', 'error');
  };

  const exportExcel = () => {
    const rows = [
      ['Online Transaction Report', fromDate + ' to ' + toDate],
      [],
      ['Type', 'Date', 'Name / Details', 'Amount', 'Staff'],
      ...safe.filter(t => t.date >= fromDate && t.date <= toDate)
        .sort((a, b) => a.date < b.date ? -1 : 1)
        .map(t => [t.type === 'received' ? 'Money Received' : 'Money Transfer', t.date, t.name, t.amount, t.staffName || '']),
      [],
      ['', '', 'Total Money Received', totalReceived],
      ['', '', 'Total Money Transfer', totalTransfer],
    ];
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:18},{wch:12},{wch:30},{wch:14},{wch:18}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Online Transactions');
    XLSX.writeFile(wb, 'Online_Transactions_' + fromDate + '_to_' + toDate + '.xlsx');
  };

  return e('div', { className: 'space-y-4' },

    // Header
    e('div', { className: 'flex flex-wrap justify-between items-center gap-3' },
      e('div', null,
        e('h3', { className: 'text-xl font-bold text-gray-800' }, 'Online Transaction'),
        e('p', { className: 'text-sm text-gray-500' }, 'Track online money received and transfers — affects Banking balance calculations')

        e('div', null, e('label', { className: 'text-xs text-gray-500 block mb-1' }, 'To'), e('input', { type: 'date', value: toDate, onChange: ev => setToDate(ev.target.value), className: 'border rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-indigo-500' })),
        e('button', { onClick: exportExcel, className: 'flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium self-end' }, e(Icon, { name: 'Download', size: 16 }), ' Export')
      )
    ),

    // Summary cards
    e('div', { className: 'grid grid-cols-2 gap-4' },
      e('div', { className: 'bg-green-50 border border-green-100 rounded-xl p-4 flex items-center gap-4' },
        e('div', { className: 'bg-green-100 p-3 rounded-xl' }, e(Icon, { name: 'TrendingUp', size: 22, className: 'text-green-600' })),
        e('div', null,
          e('p', { className: 'text-xs text-green-500 font-medium' }, 'Total Money Received'),
          e('p', { className: 'text-2xl font-bold text-green-700' }, '\u20B9' + totalReceived.toLocaleString('en-IN')),

      ),
      e('div', { className: 'bg-red-50 border border-red-100 rounded-xl p-4 flex items-center gap-4' },
        e('div', { className: 'bg-red-100 p-3 rounded-xl' }, e(Icon, { name: 'TrendingDown', size: 22, className: 'text-red-500' })),
        e('div', null,

            className: 'p-2 rounded-lg transition-colors ' + (isBanking ? 'text-green-100 hover:bg-green-600' : 'text-gray-500 hover:bg-gray-100')
          }, e(Icon, { name: 'RefreshCw', size: 18 })),
          e('button', {
            onClick: toggleFullscreen,
            title: isFullscreen ? 'Exit Fullscreen' : 'Fullscreen',
            className: 'p-2 rounded-lg transition-colors ' + (isBanking ? 'text-green-100 hover:bg-green-600' : 'text-gray-500 hover:bg-gray-100')
          }, e(Icon, { name: isFullscreen ? 'Minimize2' : 'Maximize2', size: 18 })),
          e('div', { className: 'h-px w-px mx-1' }),
          e('div', { className: 'text-right' },
            e('p', { className: `text-sm font-semibold ${(isBanking||isDashboard||isCashClose)?'text-white':'text-gray-800'}` }, currentUser.name),
            e('p', { className: `text-xs capitalize ${isBanking?'text-green-200':isDashboard?'text-purple-200':isCashClose?'text-orange-100':'text-gray-500'}` }, currentUser.role)
          ),
          e('div', { className: `h-10 w-10 rounded-full flex items-center justify-center font-bold border ${isBanking?'bg-green-600 text-white border-green-500':isDashboard?'bg-purple-600 text-white border-purple-500':isCashClose?'bg-orange-500 text-white border-orange-400':'bg-indigo-100 text-indigo-600 border-indigo-200'}` }, currentUser.name.charAt(0))
        )
      ),
      message && e('div', { className: `absolute top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg font-medium text-white ${message.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`, style: { whiteSpace: 'nowrap' } }, message.text),
      e('div', { className: 'flex-1 overflow-y-auto p-6 relative' },
        activeTab === 'dashboard' && e(Dashboard, { tasks, customers, currentUser, setPrintingReceipt, expenses }),
        activeTab === 'tracking' && e(ServiceTracking, { tasks, setTasks, customers, setCustomers, appData, persist, services, showMessage, currentUser, setPrintingReceipt }),
        activeTab === 'crm' && e(CustomerCRM, { customers, setCustomers, services, tasks, setTasks, appData, persist, showMessage, currentUser, setPrintingReceipt }),
        activeTab === 'reports' && e(ReportsInvoices, { tasks, setTasks, customers, setCustomers, appData, persist, businessProfile, setPrintingReceipt, currentUser }),
        activeTab === 'pending' && e(PendingDues, { tasks, setTasks, customers, showMessage }),
        activeTab === 'banking' && e(BankingLedger, { bankTransactions, setBankTransactions, openingBalances: bankingOpeningBalances, setOpeningBalances: setBankingOpeningBalances, archiveBankTransactions, addMoreHistory, setAddMoreHistory, onlineTransactions, accountBalanceExpenses: appData.accountBalanceExpenses || [], setAccountBalanceExpenses, accountBalanceOverrides, setAccountBalanceOverrides, currentUser, showMessage, businessProfile }),
        activeTab === 'online'   && e(OnlineTransaction, { onlineTransactions, setOnlineTransactions, currentUser, showMessage }),
        activeTab === 'expenses' && e(Expenses, { expenses, setExpenses, currentUser, showMessage }),
        activeTab === 'cashclosing' && e(DailyCashClosing, { tasks, expenses, bankTransactions, bankingOpeningBalances, cashClosingLogs, setCashClosingLogs, customers, currentUser, showMessage, businessProfile }),
        activeTab === 'performance' && currentUser.role === 'admin' && e(StaffPerformance, { tasks, users, expenses }),
        activeTab === 'salary'      && activeTab === 'salary' && e(StaffSalary, { users, appData, persist, showMessage, currentUser, businessProfile }),
        activeTab === 'settings' && e(SystemSettings, { currentUser, users, setUsers, services, setServices, businessProfile, setBusinessProfile, showMessage })
      )
    ),
    printingReceipt && e(ReceiptModal, { receipt: printingReceipt, businessProfile, onClose: () => setPrintingReceipt(null) })
  );
}

ReactDOM.render(e(App, null), document.getElementById('root'));
</script>
